<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>宇宙模拟器 · 沙盒</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #04050a;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block; position: fixed; inset: 0;
    z-index: 0;
    touch-action: none;
    cursor: crosshair;
  }
  .hud {
    position: fixed; left: 16px; top: 14px;
    color: #8d9aab; font: 12px/1.8 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none; text-shadow: 0 0 10px #000;
    z-index: 50;
  }
  .hud .t { color: #e8eef6; font-weight: 600; letter-spacing: .5px; }
  .hud .k { color: #4f5b6b; }
  .hud .life { color: #6ee7a0; }
  .hud .warn { color: #ffb36b; }
  .hud .follow { color: #6cd2ff; }
  .hud .save { color: #8bc4ff; }
  .panel {
    position: fixed; left: 10px; right: 10px; bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 1000;
    padding: 8px;
    background: rgba(6, 9, 14, 0.72);
    border: 1px solid #1a2332;
    border-radius: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button {
    background: #10151d;
    border: 1px solid #263040;
    color: #c3cede;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: #1a2230; border-color: #3a4a60; }
  button:active { background: #1c3554; }
  button.active { background: #1c3554; border-color: #3f7fd0; color: #d7e8ff; }
  button.danger.active { background: #4a1c1c; border-color: #d05555; color: #ffd7d7; }
  button.bio.active { background: #14381f; border-color: #4dbf72; color: #d6ffe3; }
  button.follow.active { background: #143349; border-color: #4db7f0; color: #d6f0ff; }
  button.save-btn { background: #14381f; border-color: #2f6d40; color: #c8f4d8; }
  button.save-btn:hover { background: #1a4a28; border-color: #4dbf72; }
  button.dot::before {
    content: ''; display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
    background: var(--c, #888); box-shadow: 0 0 8px var(--c, #888);
  }
  .lbl {
    color: #6b7789; font: 11px ui-monospace, Menlo, Consolas, monospace;
    display: flex; align-items: center; gap: 5px;
  }
  input[type=range] { width: 80px; accent-color: #4d8fe8; }
  .sep { width: 1px; height: 18px; background: #263040; margin: 0 2px; }
  .tip {
    position: fixed; right: 12px; top: 56px; text-align: right;
    color: #4f5b6b; font: 11px/1.7 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 8px #000;
  }
  .tip b { color: #7a88a0; font-weight: 600; }
  .save-btn-fixed {
    position: fixed;
    right: 12px; top: 12px;
    z-index: 100;
    padding: 8px 14px;
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    display: none;
  }
  body.in-game .save-btn-fixed { display: block; }
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 5000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal.startup {
    background: #04050a;
    padding: 0;
    align-items: stretch;
    justify-content: stretch;
  }
  .modal-content {
    background: #0a1018;
    border: 1px solid #1f2a3b;
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7);
    color: #c3cede;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  .modal.startup .modal-content {
    max-width: 100%;
    max-height: 100%;
    border-radius: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    height: 100%;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #1a2332;
    font-size: 14px;
    color: #e8eef6;
    font-weight: 600;
  }
  .modal.startup .modal-head {
    padding: 24px 24px 12px;
    border-bottom: none;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .modal-head .subtitle {
    display: block;
    font-size: 11px;
    color: #4f5b6b;
    font-weight: 400;
    letter-spacing: 0;
    margin-top: 4px;
  }
  .modal-head button {
    padding: 4px 10px;
    font-size: 14px;
    line-height: 1;
  }
  .modal.startup .modal-head button { display: none; }
  .save-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 80px;
    max-height: 50vh;
  }
  .modal.startup .save-list {
    max-height: none;
    padding: 12px 24px 24px;
    align-items: center;
  }
  .modal.startup .save-list > * {
    width: 100%;
    max-width: 480px;
  }
  .save-empty {
    color: #4f5b6b;
    text-align: center;
    padding: 30px 10px;
    font-style: italic;
  }
  .save-item {
    background: #10151d;
    border: 1px solid #1a2332;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .save-item.current {
    border-color: #2f6d40;
    background: #0d1a12;
  }
  .save-item .info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .save-item .name {
    color: #e8eef6;
    font-weight: 600;
    font-size: 13px;
    word-break: break-all;
  }
  .save-item.current .name { color: #c8f4d8; }
  .save-item .meta {
    color: #4f5b6b;
    font-size: 10px;
    white-space: nowrap;
  }
  .save-item .badge {
    display: inline-block;
    background: #2f6d40;
    color: #d4ffe0;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: .5px;
  }
  .save-item .acts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .save-item .acts button {
    padding: 6px 10px;
    font-size: 11px;
  }
  .btn-load    { background: #14381f; border-color: #2f6d40; color: #c8f4d8; }
  .btn-load:hover { background: #1a4a28; border-color: #4dbf72; }
  .btn-export  { background: #14283a; border-color: #2c5a80; color: #c7e3ff; }
  .btn-export:hover { background: #1c3a52; border-color: #3f7fb0; }
  .btn-del     { background: #2a1212; border-color: #6d2f2f; color: #ffd7d7; }
  .btn-del:hover { background: #3a1a1a; border-color: #d05555; }
  .btn-save    { background: #1a3a28; border-color: #2f6d40; color: #c8f4d8; }
  .btn-save:hover { background: #245038; border-color: #4dbf72; }
  .modal-actions {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #1a2332;
    flex-wrap: wrap;
  }
  .modal.startup .modal-actions {
    border-top: none;
    justify-content: center;
    padding: 0 24px 32px;
  }
  .modal-actions button {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
  }
  .modal.startup .modal-actions button {
    flex: 0 1 200px;
  }
  .toast {
    position: fixed;
    left: 50%; bottom: 120px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 40, 60, 0.95);
    border: 1px solid #2c5a80;
    color: #c7e3ff;
    padding: 10px 18px;
    border-radius: 10px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    z-index: 6000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    background: rgba(60, 20, 20, 0.95);
    border-color: #7a2a2a;
    color: #ffd7d7;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>

<button class="save-btn-fixed save-btn" id="btnOpenSave">💾 存档管理</button>

<div class="panel">
  <div class="row">
    <span class="lbl">模式</span>
    <button id="modeStar" class="active" title="快捷键 1">✦ 恒星</button>
    <button id="modePlanet" title="快捷键 2">● 行星</button>
    <button id="modeAsteroid" title="快捷键 3">· 小行星</button>
    <button id="modeSatellite" title="快捷键 4">◦ 卫星</button>
    <button id="modeFollow" class="follow" title="快捷键 5">◎ 跟随</button>
    <button id="modeDelete" class="danger" title="快捷键 6">✕ 删除</button>
  </div>

  <div class="row">
    <span class="lbl">类型</span>
    <div id="typeRow" class="row"></div>
  </div>

  <div class="row">
    <span class="lbl">初速</span>
    <button id="motOrbit" class="active">轨道</button>
    <button id="motStatic">静止</button>
    <span class="sep"></span>
    <label class="lbl">大小 <input id="size" type="range" min="0.5" max="2.5" step="0.1" value="1"></label>
    <span class="lbl" id="sizeVal">1.0×</span>
  </div>

  <div class="row">
    <label class="lbl">速度 <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1"></label>
    <span class="lbl" id="speedVal">1.0×</span>
    <span class="sep"></span>
    <button id="btnSaveQuick" class="save-btn">💾 保存</button>
    <button id="btnHabitable" class="bio" title="快捷键 H">◎ 宜居带</button>
    <button id="btnPause" title="空格">暂停</button>
    <button id="btnResetView" title="快捷键 R">重置视角</button>
    <button id="btnClear" class="danger">全部清空</button>
    <button id="btnExit" class="danger">⏏ 退出</button>
  </div>
</div>

<div class="tip">
  <b>触屏</b> 单指滑动 · 双指捏合 · 轻点放置<br>
  <b>电脑</b> 右键拖拽平移 · 滚轮缩放 · 左键放置<br>
  <b>键盘</b> 空格暂停 · R重置 · H宜居带 · 1-6模式<br>
  <b>键盘</b> F跟随 · Del删除选中 · Esc取消 · 方向键平移
</div>

<div class="modal" id="saveModal">
  <div class="modal-content">
    <div class="modal-head">
      <div id="modalTitle">
        选择存档
        <span class="subtitle" id="modalSubtitle">加载一个已有的宇宙，或新建一个</span>
      </div>
      <button id="modalClose">✕</button>
    </div>
    <div class="save-list" id="saveList"></div>
    <div class="modal-actions">
      <button id="btnNewSave" class="btn-load">＋ 新建宇宙</button>
      <button id="btnImportSave" class="btn-export">⬆ 导入存档</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================================
   宇宙模拟器 —— 恒星 / 行星 / 小行星 / 卫星 沙盒
   · 启动时进入存档页
   · 天体合并：动量守恒 + 位置取质心
   · 相机：用平滑 smoothMaxD 避免双星椭圆轨道引起的缩放抖动
   · 跟随视角、卫星绑定、生命系统、存档系统
   ============================================================= */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];

let __lastResizeW = 0, __lastResizeH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const newW = window.innerWidth, newH = window.innerHeight;
  if (newW === __lastResizeW && newH === __lastResizeH && W > 0) return;
  __lastResizeW = newW; __lastResizeH = newH;
  W = newW; H = newH;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  stars = [];
  const n = Math.round(W * H / 8000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.3 + 0.25,
      a: Math.random() * 0.55 + 0.12
    });
  }
}
let __resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(resize, 150);
});

/* ===================== 物理常量 ===================== */
const G         = 1;
const BASE_STEP = 0.0004;
const SOFTENING = 0.06;
const MAX_STEPS = 800;
const OVERLAP_CHECK_DIST = 0.15;
const SAMPLE_DT = 0.02;
const MAX_TRAIL = 1200;
const CHUNK     = 16;
const TWO_PI    = Math.PI * 2;

const SATELLITE_SPEED_MUL = 12;
const IMPACT_BASE_R     = 0.28;
const IMPACT_R_PER_SIZE = 0.14;
const SAT_INTERCEPT_PER = 0.35;
const SAT_INTERCEPT_MAX = 0.75;

const SIZE_FROM_MASS_EXP = 1 / 2.5;

const MIN_ZOOM = 0.05;
const MAX_ZOOM = 60;

/* ===================== 天体类型表 ===================== */
const STAR_TYPES = {
  m: { name: '红矮星', mass: 0.35, rMul: 0.78, rgb: [255, 138, 105] },
  k: { name: '橙矮星', mass: 0.70, rMul: 0.90, rgb: [255, 182, 120] },
  g: { name: '类太阳', mass: 1.00, rMul: 1.00, rgb: [255, 202,  92] },
  o: { name: '蓝巨星', mass: 3.20, rMul: 1.55, rgb: [150, 200, 255] },
  r: { name: '红巨星', mass: 1.40, rMul: 2.10, rgb: [255, 110,  80] },
  w: { name: '白矮星', mass: 0.85, rMul: 0.42, rgb: [218, 236, 255] },
};

const PLANET_TYPES = {
  rock:   { name: '岩质行星',   mass: 2.5e-4, water: false, rgb: [186, 168, 148] },
  desert: { name: '沙漠行星',   mass: 3.0e-4, water: false, rgb: [224, 176, 108] },
  gas:    { name: '气态巨行星', mass: 1.8e-3, water: false, rgb: [232, 190, 140] },
  terra:  { name: '类地行星',   mass: 4.0e-4, water: true,  rgb: [ 96, 170, 255] },
  ocean:  { name: '海洋行星',   mass: 5.0e-4, water: true,  rgb: [ 62, 124, 224] },
  ice:    { name: '冰封行星',   mass: 3.5e-4, water: true,  rgb: [178, 222, 255] },
};

const ASTEROID_TYPES = {
  stony: { name: '石质小行星', mass: 2.0e-6, water: false, rgb: [172, 156, 140] },
  icy:   { name: '冰质小行星', mass: 3.0e-6, water: true,  rgb: [176, 212, 238] },
};

const SATELLITE_TYPES = {
  rocky: { name: '岩石卫星', mass: 4.0e-6, water: false, rgb: [196, 196, 202] },
  icy:   { name: '冰质卫星', mass: 5.5e-6, water: true,  rgb: [190, 222, 250] },
};

const CATEGORIES = {
  star:      { label: '恒星',   types: STAR_TYPES },
  planet:    { label: '行星',   types: PLANET_TYPES },
  asteroid:  { label: '小行星', types: ASTEROID_TYPES },
  satellite: { label: '卫星',   types: SATELLITE_TYPES },
};

/* ===================== 全局状态 ===================== */
let bodies = [];
let simTime = 0;
let prevSimTime = 0;
let nextSample = 0;
let acc = 0;
let paused = false;
let speed = 1;
let E0 = 0;

let camX = 0, camY = 0, camScale = 220;
const camTarget = { x: 0, y: 0, s: 220 };

let userZoom  = 1;
let userPanX  = 0;
let userPanY  = 0;

let smoothMaxD = 0.6;

let mode = 'star';
let catType = { star: 'g', planet: 'terra', asteroid: 'stony', satellite: 'rocky' };
let placeMotion = 'orbit';
let sizeMul = 1;

let mouseX = -1, mouseY = -1;
let hoverBody = null;

let showHabitableZone = false;
let selectedBody = null;
let impactEvents = [];

let inGame = false;
let currentSaveId = null;

let lastT = performance.now();

/* ★ Bug 2 修复：将碰撞检测计数器移到模块级，跨帧累积 */
let stepsSinceImpactCheck = 0;

/* ★ E0 延迟建立（避免初始瞬态污染基准）
   ★ 只在两种时机触发：
     1) 空宇宙里放下第一个天体
     2) 加载存档后立即锁定（不走延迟）
   其他所有操作（继续放置、删除、合并）都不重建 E0。 */
let __e0Initialized = false;
let __e0Pending = false;
let __e0DelayTimer = 0;
function markE0Dirty() {
  __e0Pending = true;
  __e0DelayTimer = 0;
}

/* ===================== 工具 ===================== */
function getCentroid() {
  let M = 0, cx = 0, cy = 0;
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    M += b.m; cx += b.m * b.x; cy += b.m * b.y;
  }
  if (M > 0) { cx /= M; cy /= M; }
  return { x: cx, y: cy, M };
}

function getRefPoint() {
  if (selectedBody && bodies.indexOf(selectedBody) >= 0) {
    return { x: selectedBody.x, y: selectedBody.y };
  }
  const { x, y } = getCentroid();
  return { x: x || 0, y: y || 0 };
}

function sizeFromMass(kind, typeKey, mass) {
  const baseMass = CATEGORIES[kind].types[typeKey].mass;
  return Math.pow(mass / baseMass, SIZE_FROM_MASS_EXP);
}

/* ===================== 宜居带 ===================== */
function starLuminosity(star) {
  return Math.pow(Math.max(star.m, 0.05), 3.0);
}

function habitableZone(star) {
  const L = starLuminosity(star);
  const rIn  = 0.85 * Math.sqrt(L);
  const rOut = 1.85 * Math.sqrt(L);
  return { rIn, rOut, L };
}

function getHabitabilityInfo(body) {
  let closestStar = null;
  let closestDist = Infinity;
  let closestHZ = null;
  for (const s of bodies) {
    if (s.kind !== 'star') continue;
    const d = Math.hypot(body.x - s.x, body.y - s.y);
    if (d < closestDist) {
      closestDist = d;
      closestStar = s;
      closestHZ = habitableZone(s);
    }
  }
  if (!closestStar) {
    return { inHZ: false, tooHot: false, tooCold: true, star: null, dist: 0, hz: null };
  }
  const tooHot  = closestDist < closestHZ.rIn * 0.75;
  const tooCold = closestDist > closestHZ.rOut * 1.5;
  const inHZ    = closestDist >= closestHZ.rIn && closestDist <= closestHZ.rOut;
  return { inHZ, tooHot, tooCold, star: closestStar, dist: closestDist, hz: closestHZ };
}

function isInHabitableZoneSimple(body) {
  return getHabitabilityInfo(body).inHZ;
}

/* ===================== 创建天体 ===================== */
function createBody(kind, typeKey, sizeMulVal, x, y) {
  const t = CATEGORIES[kind].types[typeKey];
  const mass = t.mass * Math.pow(sizeMulVal, 2.5);
  return {
    kind, typeKey, name: t.name, m: mass,
    x, y, vx: 0, vy: 0, ax: 0, ay: 0,
    sizeMul: sizeMulVal, rMul: t.rMul || 1,
    water: !!t.water, rgb: t.rgb.slice(), trail: [x, y],
    host: null, orbitRadius: 0, orbitPhase: 0, orbitAngularSpeed: 0,
    life: 0, lifeStage: 'barren', gestationTimer: 0,
    flash: 0, flashColor: null,
  };
}

/* ===================== 物理积分 ===================== */
let cachedMinD = Infinity;
function computeAccel() {
  const n = bodies.length;
  let minD2 = Infinity;
  for (let i = 0; i < n; i++) { bodies[i].ax = 0; bodies[i].ay = 0; }
  for (let i = 0; i < n; i++) {
    const bi = bodies[i];
    if (bi.kind === 'satellite') continue;
    for (let j = i + 1; j < n; j++) {
      const bj = bodies[j];
      if (bj.kind === 'satellite') continue;
      const dx = bj.x - bi.x;
      const dy = bj.y - bi.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < minD2) minD2 = d2;
      const d2s = d2 + SOFTENING * SOFTENING;
      const inv = 1 / (d2s * Math.sqrt(d2s));
      const f = G * inv;
      bi.ax += f * bj.m * dx;  bi.ay += f * bj.m * dy;
      bj.ax -= f * bi.m * dx;  bj.ay -= f * bi.m * dy;
    }
  }
  cachedMinD = minD2 === Infinity ? 1 : Math.sqrt(minD2);
}

/* ★ 固定步长。近距接近时由 checkOverlapMerge 提前合并。 */
function vvStep() {
  const h = BASE_STEP;

  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    b.x += b.vx * h + 0.5 * b.ax * h * h;
    b.y += b.vy * h + 0.5 * b.ay * h * h;
    b.vx += 0.5 * b.ax * h;
    b.vy += 0.5 * b.ay * h;
  }
  computeAccel();
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    b.vx += 0.5 * b.ax * h;
    b.vy += 0.5 * b.ay * h;
  }

  for (const b of bodies) {
    if (b.kind !== 'satellite' || !b.host) continue;
    b.orbitPhase += b.orbitAngularSpeed * h;
    b.x = b.host.x + Math.cos(b.orbitPhase) * b.orbitRadius;
    b.y = b.host.y + Math.sin(b.orbitPhase) * b.orbitRadius;
    const tang = b.orbitRadius * b.orbitAngularSpeed;
    b.vx = b.host.vx - Math.sin(b.orbitPhase) * tang;
    b.vy = b.host.vy + Math.cos(b.orbitPhase) * tang;
  }
  return h;
}

/* ★ 提前合并 —— 当两个天体已经重叠时立即合并 */
function checkOverlapMerge() {
  const toRemove = new Set();
  const events = [];
  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (toRemove.has(bi) || bi.kind === 'satellite') continue;
    for (let j = i + 1; j < bodies.length; j++) {
      const bj = bodies[j];
      if (toRemove.has(bj) || bj.kind === 'satellite') continue;

      /* ★ 跳过"行星-小行星"对，交给 resolveCollisions（含卫星拦截） */
      const isAstPla =
        (bi.kind === 'asteroid' && bj.kind === 'planet') ||
        (bi.kind === 'planet' && bj.kind === 'asteroid');
      if (isAstPla) continue;

      const d = Math.hypot(bj.x - bi.x, bj.y - bi.y);
      if (d < collisionRadius(bi) + collisionRadius(bj)) {
        const big   = bi.m >= bj.m ? bi : bj;
        const small = bi.m >= bj.m ? bj : bi;

        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === small && !toRemove.has(s)) {
            s.host = big;
            const ddx = s.x - big.x, ddy = s.y - big.y;
            s.orbitRadius = Math.max(0.15, Math.hypot(ddx, ddy));
            s.orbitPhase = Math.atan2(ddy, ddx);
            const vPhys = Math.sqrt(G * Math.max(big.m, 1e-9) / s.orbitRadius);
            s.orbitAngularSpeed = (vPhys / s.orbitRadius) * SATELLITE_SPEED_MUL;
          }
        }
        if (small.kind === 'planet' && (small.lifeStage === 'alive' || small.life > 0)) {
          killLife(small, [255, 100, 60]);
        }
        const mergedM = big.m + small.m;
        big.vx = (big.m * big.vx + small.m * small.vx) / mergedM;
        big.vy = (big.m * big.vy + small.m * small.vy) / mergedM;
        big.x  = (big.m * big.x  + small.m * small.x)  / mergedM;
        big.y  = (big.m * big.y  + small.m * small.y)  / mergedM;
        big.m  = mergedM;
        big.sizeMul = Math.min(4.0, sizeFromMass(big.kind, big.typeKey, big.m));

        if (selectedBody === small) selectedBody = big;
        events.push({ x: big.x, y: big.y, t: 0, type: 'impact' });
        toRemove.add(small);
      }
    }
  }
  if (toRemove.size === 0) return false;
  if (selectedBody && toRemove.has(selectedBody)) selectedBody = null;
  bodies = bodies.filter(b => !toRemove.has(b));
  for (const ev of events) impactEvents.push(ev);
  return true;
}

function totalEnergy() {
  let K = 0, U = 0;
  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (bi.kind === 'satellite') continue;
    K += 0.5 * bi.m * (bi.vx * bi.vx + bi.vy * bi.vy);
    for (let j = i + 1; j < bodies.length; j++) {
      const bj = bodies[j];
      if (bj.kind === 'satellite') continue;
      const r = Math.hypot(bj.x - bi.x, bj.y - bi.y);
      U -= G * bi.m * bj.m / Math.max(r, SOFTENING);
    }
  }
  return K + U;
}

function sampleTrails() {
  const maxLen = MAX_TRAIL * 2;
  for (const b of bodies) {
    b.trail.push(b.x, b.y);
    if (b.trail.length > maxLen) b.trail.splice(0, b.trail.length - maxLen);
  }
}

/* ===================== 生命系统 ===================== */
function killLife(b, color) {
  b.flash = 1.0;
  b.flashColor = color || [255, 120, 90];
  b.life = 0;
  b.lifeStage = 'barren';
  b.gestationTimer = 0;
}

/* ===================== 碰撞处理 ===================== */
function collisionRadius(b) {
  if (b.kind === 'star')      return 0.10 * b.rMul * b.sizeMul;
  if (b.kind === 'planet')    return 0.06 * b.sizeMul;
  if (b.kind === 'asteroid')  return 0.03 * b.sizeMul;
  if (b.kind === 'satellite') return 0.03 * b.sizeMul;
  return 0.05;
}

function resolveCollisions() {
  const toRemove = new Set();
  const events = [];

  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (toRemove.has(bi)) continue;
    if (bi.kind === 'satellite') continue;

    for (let j = i + 1; j < bodies.length; j++) {
      const bj = bodies[j];
      if (toRemove.has(bj)) continue;
      if (bj.kind === 'satellite') continue;

      const d = Math.hypot(bj.x - bi.x, bj.y - bi.y);

      const biAst = bi.kind === 'asteroid';
      const bjAst = bj.kind === 'asteroid';
      const biPla = bi.kind === 'planet';
      const bjPla = bj.kind === 'planet';

      let isCollision = false;
      let isAsteroidImpact = false;

      if ((biAst && bjPla) || (bjAst && biPla)) {
        const planet = biPla ? bi : bj;
        const r = IMPACT_BASE_R + IMPACT_R_PER_SIZE * planet.sizeMul;
        if (d < r) {
          isCollision = true;
          isAsteroidImpact = true;
        }
      } else {
        const rA = collisionRadius(bi);
        const rB = collisionRadius(bj);
        if (d < rA + rB) isCollision = true;
      }

      if (!isCollision) continue;

      let big, small;
      if (bi.m >= bj.m) { big = bi; small = bj; }
      else { big = bj; small = bi; }

      if (isAsteroidImpact) {
        const planet = biPla ? bi : bj;
        const asteroid = biAst ? bi : bj;

        let satCount = 0;
        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === planet && !toRemove.has(s)) satCount++;
        }

        let intercepted = false;
        if (satCount > 0) {
          const chance = Math.min(SAT_INTERCEPT_MAX, SAT_INTERCEPT_PER * satCount);
          if (Math.random() < chance) intercepted = true;
        }

        if (intercepted) {
          events.push({ x: planet.x, y: planet.y, t: 0, type: 'shield' });
          toRemove.add(asteroid);
        } else {
          if (planet.lifeStage === 'gestating') {
            planet.gestationTimer = 10 + Math.random() * 20;
            planet.flash = 0.9;
            planet.flashColor = [255, 180, 80];
          } else if (planet.lifeStage === 'alive' || planet.life > 0) {
            killLife(planet, [255, 130, 60]);
          } else {
            planet.flash = 0.6;
            planet.flashColor = [255, 160, 70];
          }
          events.push({ x: planet.x, y: planet.y, t: 0, type: 'impact' });

          const mergedMP = planet.m + asteroid.m;
          planet.vx = (planet.m * planet.vx + asteroid.m * asteroid.vx) / mergedMP;
          planet.vy = (planet.m * planet.vy + asteroid.m * asteroid.vy) / mergedMP;
          planet.x = (planet.m * planet.x + asteroid.m * asteroid.x) / mergedMP;
          planet.y = (planet.m * planet.y + asteroid.m * asteroid.y) / mergedMP;
          planet.m  = mergedMP;
          planet.sizeMul = Math.min(4.0, sizeFromMass(planet.kind, planet.typeKey, planet.m));

          if (selectedBody === asteroid) selectedBody = planet;
          toRemove.add(asteroid);
        }
      } else {
        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === small && !toRemove.has(s)) {
            s.host = big;
            const dx = s.x - big.x;
            const dy = s.y - big.y;
            s.orbitRadius = Math.max(0.15, Math.hypot(dx, dy));
            s.orbitPhase = Math.atan2(dy, dx);
            const vPhys = Math.sqrt(G * Math.max(big.m, 1e-9) / s.orbitRadius);
            s.orbitAngularSpeed = (vPhys / s.orbitRadius) * SATELLITE_SPEED_MUL;
          }
        }

        if (small.kind === 'planet' && (small.lifeStage === 'alive' || small.life > 0)) {
          killLife(small, [255, 100, 60]);
        }

        events.push({ x: big.x, y: big.y, t: 0, type: 'impact' });

        const mergedM = big.m + small.m;
        big.vx = (big.m * big.vx + small.m * small.vx) / mergedM;
        big.vy = (big.m * big.vy + small.m * small.vy) / mergedM;
        big.x  = (big.m * big.x  + small.m * small.x)  / mergedM;
        big.y  = (big.m * big.y  + small.m * small.y)  / mergedM;
        big.m  = mergedM;
        big.sizeMul = Math.min(4.0, sizeFromMass(big.kind, big.typeKey, big.m));

        if (selectedBody === small) selectedBody = big;
        toRemove.add(small);
      }
    }
  }

  if (toRemove.size > 0) {
    if (selectedBody && toRemove.has(selectedBody)) selectedBody = null;
    bodies = bodies.filter(b => !toRemove.has(b));
    computeAccel();
  }

  for (const ev of events) impactEvents.push(ev);
}

/* ===================== 生命演化 ===================== */
function updateLife(simDt) {
  if (simDt <= 0) return;
  /* ★ resolveCollisions 已移至主循环物理步内，此处不再调用 */

  for (const b of bodies) {
    if (b.kind !== 'planet') continue;
    if (b.flash > 0) b.flash = Math.max(0, b.flash - simDt * 1.6);
    const info = getHabitabilityInfo(b);

    if (info.tooHot) {
      if (b.lifeStage === 'alive' || b.life > 0 || b.lifeStage === 'gestating') {
        killLife(b, [255, 90, 60]);
      }
      continue;
    }

    if (info.inHZ && b.water) {
      if (b.lifeStage === 'barren') {
        b.lifeStage = 'gestating';
        b.gestationTimer = 10 + Math.random() * 20;
      } else if (b.lifeStage === 'gestating') {
        b.gestationTimer -= simDt;
        if (b.gestationTimer <= 0) {
          b.lifeStage = 'alive';
          b.life = 0.08;
          b.flash = 0.6;
          b.flashColor = [140, 255, 180];
        }
      } else if (b.lifeStage === 'alive') {
        b.life = Math.min(1, b.life + 0.06 * simDt);
      }
    } else {
      if (b.lifeStage === 'gestating') {
        b.lifeStage = 'barren';
        b.gestationTimer = 0;
      } else if (b.lifeStage === 'alive') {
        const decay = info.tooCold ? 0.03 : 0.05;
        b.life = Math.max(0, b.life - decay * simDt);
        if (b.life <= 0.02) killLife(b, [120, 180, 255]);
      }
    }
  }
  for (const ev of impactEvents) ev.t += simDt;
  impactEvents = impactEvents.filter(ev => ev.t < 1.2);
}

/* ===================== 放置天体 ===================== */
function placeBody(kind, typeKey, sizeMulVal, x, y, motion, host) {
  const b = createBody(kind, typeKey, sizeMulVal, x, y);

  if (kind === 'satellite') {
    if (!host) return null;
    b.host = host;
    const dx = x - host.x, dy = y - host.y;
    let r = Math.hypot(dx, dy);
    const minR = 0.12 + 0.10 * host.sizeMul;
    const maxR = 1.6;
    if (r < minR) r = minR;
    if (r > maxR) r = maxR;
    b.orbitRadius = r;
    b.orbitPhase = Math.atan2(dy, dx);
    const vPhys = Math.sqrt(G * Math.max(host.m, 1e-9) / r);
    b.orbitAngularSpeed = (vPhys / r) * SATELLITE_SPEED_MUL;
    b.x = host.x + Math.cos(b.orbitPhase) * r;
    b.y = host.y + Math.sin(b.orbitPhase) * r;
    b.vx = host.vx - Math.sin(b.orbitPhase) * r * b.orbitAngularSpeed;
    b.vy = host.vy + Math.cos(b.orbitPhase) * r * b.orbitAngularSpeed;
  } else if (motion === 'orbit') {
    /* ★ 找主导天体（质量最大的非卫星天体），只与它构成两体圆轨道。 */
    let dominant = null;
    let maxMass = 0;
    for (const other of bodies) {
      if (other.kind === 'satellite') continue;
      if (other.m > maxMass) { maxMass = other.m; dominant = other; }
    }

    if (dominant) {
      const dx = x - dominant.x, dy = y - dominant.y;
      const r = Math.hypot(dx, dy);
      /* ★ 隐患修复：给 minR 加上上限，避免红巨星拉满时周围 1.5 半径内只能静止放置。 */
      const minR = Math.max(0.3, Math.min(1.0, collisionRadius(dominant) * 3));
      
      if (r > minR) {
        const totalM = dominant.m + b.m;
        /* ★ 限制最大圆轨道速度，防止极端情况速度爆炸。 */
        const vRel = Math.min(Math.sqrt(G * totalM / r), 8);
        const ux = -dy / r, uy = dx / r;

        /* ★ Bug 1 修复：把 dominant 的当前速度纳入计算。
           两体圆轨道的正确解（保持动量守恒 + 相对速度 = vRel·切向）：
           dominant.v' = (m_a·v_a - m_b·vRel·u) / totalM
           b.v         = m_a·(v_a + vRel·u) / totalM
           v_a = 0 时退化为原实现；v_a ≠ 0（双星/漂移系统）时修正。 */
        const vAx = dominant.vx, vAy = dominant.vy;
        dominant.vx = (dominant.m * vAx - b.m * vRel * ux) / totalM;
        dominant.vy = (dominant.m * vAy - b.m * vRel * uy) / totalM;
        b.vx = (dominant.m / totalM) * (vAx + vRel * ux);
        b.vy = (dominant.m / totalM) * (vAy + vRel * uy);
      }
      /* r <= minR：静止放置，让引力自然决定命运（被捕获、被弹飞、或落入主导天体）。 */
    }
  }

  /* ★ E0 只在"从空宇宙放下第一个天体"时建立。 */
  const wasEmpty = bodies.length === 0;
  bodies.push(b);
  computeAccel();
  sampleTrails();
  if (wasEmpty) markE0Dirty();
  return b;
}

/* ===================== 查找 / 删除 ===================== */
function findBodyAtScreen(px, py) {
  let best = null, bestD = 34;
  const ox = W * 0.5, oy = H * 0.5;
  for (const b of bodies) {
    const sx = ox + (b.x - camX) * camScale;
    const sy = oy - (b.y - camY) * camScale;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function findHostForSatellite(px, py) {
  let best = null, bestD = 60;
  const ox = W * 0.5, oy = H * 0.5;
  for (const b of bodies) {
    if (b.kind !== 'star' && b.kind !== 'planet') continue;
    const sx = ox + (b.x - camX) * camScale;
    const sy = oy - (b.y - camY) * camScale;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function deleteBody(b) {
  if (selectedBody === b) selectedBody = null;
  for (let k = bodies.length - 1; k >= 0; k--) {
    const s = bodies[k];
    if (s !== b && s.kind === 'satellite' && s.host === b) {
      if (selectedBody === s) selectedBody = null;
      bodies.splice(k, 1);
    }
  }
  const i = bodies.indexOf(b);
  if (i >= 0) bodies.splice(i, 1);
  computeAccel();
  hoverBody = null;
}

/* ===================== 相机 ===================== */
/* ★ 纯函数：只读取 smoothMaxD，不修改状态 */
function computeBaseScale() {
  if (!bodies.length) return 220;
  return Math.max(Math.min(W, H) * 0.36 / Math.max(smoothMaxD, 0.01), 0.5);
}

/* ★ 有副作用：更新 smoothMaxD，只在 updateCamera 里调用 */
function updateSmoothMaxD() {
  if (!bodies.length) {
    smoothMaxD = 0.6;
    return;
  }
  const { x: cx, y: cy } = getCentroid();
  let maxD = 0.6;
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    const d = Math.hypot(b.x - cx, b.y - cy);
    if (d > maxD) maxD = d;
  }
  /* ★ 骤降检测：若当前尺度远小于平滑值，直接重置，避免删除天体后缩放卡住 */
  if (maxD < smoothMaxD * 0.3) {
    smoothMaxD = maxD;
  } else if (maxD > smoothMaxD) {
    smoothMaxD = maxD;
  } else {
    smoothMaxD = smoothMaxD * 0.998 + maxD * 0.002;
  }
}

function clampUserZoom(z) {
  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
}

function updateCamera(dt) {
  if (isGesturing) return;
  updateSmoothMaxD();

  if (selectedBody && bodies.indexOf(selectedBody) >= 0) {
    const k = Math.min(1, dt * 16);
    camTarget.x = selectedBody.x + userPanX;
    camTarget.y = selectedBody.y + userPanY;
    camTarget.s = computeBaseScale() * userZoom;
    camX += (camTarget.x - camX) * k;
    camY += (camTarget.y - camY) * k;
    camScale += (camTarget.s - camScale) * k;
    return;
  }

  const k = 1 - Math.pow(0.0015, Math.min(dt, 0.05));

  if (!bodies.length) {
    camTarget.x = userPanX;
    camTarget.y = userPanY;
    camTarget.s = 220 * userZoom;
    camX += (camTarget.x - camX) * k * 0.5;
    camY += (camTarget.y - camY) * k * 0.5;
    camScale += (camTarget.s - camScale) * k * 0.5;
    return;
  }

  const { x: cx, y: cy } = getCentroid();
  camTarget.x = cx + userPanX;
  camTarget.y = cy + userPanY;
  camTarget.s = computeBaseScale() * userZoom;

  camX += (camTarget.x - camX) * k;
  camY += (camTarget.y - camY) * k;
  camScale += (camTarget.s - camScale) * k;
}

function resetView() {
  userZoom = 1;
  userPanX = 0;
  userPanY = 0;
  smoothMaxD = 0.6;
}

/* ===================== 键盘辅助 ===================== */
function panByKey(dx, dy) {
  const step = 90 / camScale;
  userPanX += dx * step;
  userPanY += dy * step;
}

function zoomBy(factor) {
  userZoom = clampUserZoom(userZoom * factor);
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btnPause');
  btn.textContent = paused ? '继续' : '暂停';
  lastT = performance.now();
}

/* ===================== 渲染尺寸 ===================== */
function coreRadius(b) {
  if (b.kind === 'star')      return 5.5 * b.rMul * b.sizeMul;
  if (b.kind === 'planet')    return 1.6 + 1.8 * b.sizeMul;
  if (b.kind === 'asteroid')  return 0.7 + 0.9 * b.sizeMul;
  return 1.0 + 1.0 * b.sizeMul;
}

/* ===================== 渲染 ===================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#9db2cc';
  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  const ox = W * 0.5, oy = H * 0.5;
  const SX = x => ox + (x - camX) * camScale;
  const SY = y => oy - (y - camY) * camScale;

  if (mode === 'delete' && mouseX >= 0) {
    hoverBody = findBodyAtScreen(mouseX, mouseY);
  } else {
    hoverBody = null;
  }

  if (mode === 'satellite') {
    const pulse = 0.55 + 0.35 * Math.sin(simTime * 3.0 + performance.now() * 0.002);
    for (const b of bodies) {
      if (b.kind !== 'star' && b.kind !== 'planet') continue;
      const x = SX(b.x), y = SY(b.y);
      const baseR = coreRadius(b) * 3.5 + 8;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = pulse;
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255, 215, 110, 0.95)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y, baseR, 0, TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  if (showHabitableZone) {
    for (const b of bodies) {
      if (b.kind !== 'star') continue;
      const x = SX(b.x), y = SY(b.y);
      const hz = habitableZone(b);
      const rInPx  = hz.rIn  * camScale;
      const rOutPx = hz.rOut * camScale;
      if (rOutPx < 4) continue;

      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(x, y, rOutPx, 0, TWO_PI);
      if (rInPx > 0.5) ctx.arc(x, y, rInPx, 0, TWO_PI, true);
      ctx.fillStyle = 'rgba(70, 235, 130, 0.075)';
      ctx.fill('evenodd');

      ctx.strokeStyle = 'rgba(90, 245, 150, 0.32)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, rInPx, 0, TWO_PI); ctx.stroke();
      ctx.strokeStyle = 'rgba(90, 245, 150, 0.22)';
      ctx.beginPath(); ctx.arc(x, y, rOutPx, 0, TWO_PI); ctx.stroke();

      if (rOutPx > 10) {
        const grd = ctx.createRadialGradient(x, y, rInPx, x, y, rOutPx);
        grd.addColorStop(0.00, 'rgba(80,240,140,0)');
        grd.addColorStop(0.50, 'rgba(80,240,140,0.10)');
        grd.addColorStop(1.00, 'rgba(80,240,140,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(x, y, rOutPx, 0, TWO_PI); ctx.fill();
      }
      if (rOutPx > 55) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#6ee7a0';
        ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('宜居带', x, y - rOutPx - 6);
        ctx.globalAlpha = 1;
      }
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const b of bodies) {
    const t = b.trail;
    const n = t.length / 2;
    if (n < 2) continue;
    const [r, g, bl] = b.rgb;
    const isStar = b.kind === 'star';
    const isSat  = b.kind === 'satellite';
    ctx.strokeStyle = `rgb(${r},${g},${bl})`;
    ctx.lineWidth = isStar ? 1.5 : (isSat ? 0.9 : 1.1);

    for (let s = 0; s < n - 1; s += CHUNK) {
      const e = Math.min(s + CHUNK, n - 1);
      const a = (isStar ? 0.50 : (isSat ? 0.35 : 0.42)) * Math.pow(s / (n - 1), 1.7);
      if (a < 0.008) continue;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(SX(t[s * 2]), SY(t[s * 2 + 1]));
      for (let k = s + 1; k <= e; k++) {
        ctx.lineTo(SX(t[k * 2]), SY(t[k * 2 + 1]));
      }
      ctx.stroke();
    }
  }

  for (const b of bodies) {
    const x = SX(b.x), y = SY(b.y);
    if (x < -320 || x > W + 320 || y < -320 || y > H + 320) continue;

    const [r, g, bl] = b.rgb;
    const core = coreRadius(b);
    const isStar = b.kind === 'star';
    const R = core * (isStar ? 6.5 : 5);

    if (b.kind === 'planet' && b.lifeStage === 'gestating') {
      const prog = 1 - Math.max(0, b.gestationTimer) / 30;
      const pulse = 0.55 + 0.45 * Math.sin(simTime * 3.0);
      const gr = core * (2.0 + prog * 1.5) * 4;
      const grd = ctx.createRadialGradient(x, y, 0, x, y, gr);
      grd.addColorStop(0.00, `rgba(120,235,190,${0.10 + 0.10 * pulse * prog})`);
      grd.addColorStop(0.55, `rgba( 90,220,160,${0.04 * prog})`);
      grd.addColorStop(1.00, 'rgba( 60,200,130,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, TWO_PI); ctx.fill();
    }

    if (b.kind === 'planet' && b.life > 0.02) {
      const lifeR = core * (2.2 + b.life * 3.4) * 4;
      const pulse = 1 + 0.06 * Math.sin(simTime * 2.4);
      const grd = ctx.createRadialGradient(x, y, 0, x, y, lifeR * pulse);
      const baseA = b.life * 0.55;
      grd.addColorStop(0.00, `rgba(140,255,180,${baseA})`);
      grd.addColorStop(0.22, `rgba( 90,235,140,${baseA * 0.55})`);
      grd.addColorStop(0.55, `rgba( 60,200,110,${baseA * 0.18})`);
      grd.addColorStop(1.00, 'rgba( 40,170, 90,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, lifeR * pulse, 0, TWO_PI); ctx.fill();
    }

    if (b.kind === 'planet' && b.flash > 0 && b.flashColor) {
      const [fr, fg, fb] = b.flashColor;
      const flashR = core * (3.0 + (1 - b.flash) * 6.0) * 4;
      const grd = ctx.createRadialGradient(x, y, 0, x, y, flashR);
      grd.addColorStop(0.00, `rgba(${fr},${fg},${fb},${b.flash * 0.75})`);
      grd.addColorStop(0.45, `rgba(${fr},${fg},${fb},${b.flash * 0.28})`);
      grd.addColorStop(1.00, `rgba(${fr},${fg},${fb},0)`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, flashR, 0, TWO_PI); ctx.fill();
    }

    const grd = ctx.createRadialGradient(x, y, 0, x, y, R);
    if (isStar) {
      grd.addColorStop(0.00, 'rgba(255,255,255,0.98)');
      grd.addColorStop(0.10, `rgba(${r},${g},${bl},0.95)`);
      grd.addColorStop(0.32, `rgba(${r},${g},${bl},0.30)`);
      grd.addColorStop(0.65, `rgba(${r},${g},${bl},0.08)`);
      grd.addColorStop(1.00, `rgba(${r},${g},${bl},0)`);
    } else {
      grd.addColorStop(0.00, 'rgba(255,255,255,0.95)');
      grd.addColorStop(0.16, `rgba(${r},${g},${bl},0.92)`);
      grd.addColorStop(0.42, `rgba(${r},${g},${bl},0.26)`);
      grd.addColorStop(1.00, `rgba(${r},${g},${bl},0)`);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x, y, R, 0, TWO_PI); ctx.fill();

    if (b.water && !isStar) {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = 'rgba(130,205,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, core * 1.6, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (b.kind === 'planet' && b.life > 0.35) {
      const lifeAlpha = Math.min(0.85, (b.life - 0.35) * 1.5);
      ctx.globalAlpha = lifeAlpha;
      ctx.strokeStyle = 'rgba(120,255,170,0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, core * 2.4, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (b.kind === 'planet' && b.lifeStage === 'gestating') {
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = 'rgba(140,235,180,0.7)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.arc(x, y, core * 2.0, 0, TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if (b === selectedBody) {
      const t = performance.now() * 0.003;
      const rr = core * 3.2 + 8 + Math.sin(t) * 3;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.95;
      ctx.strokeStyle = 'rgba(100, 220, 255, 0.95)';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.arc(x, y, rr, 0, TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = 'rgba(150, 235, 255, 0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, rr + 5, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const ev of impactEvents) {
    const x = SX(ev.x), y = SY(ev.y);
    const prog = ev.t / 1.2;
    const alpha = Math.max(0, 1 - prog);
    const ringR = 20 + prog * 90;

    if (ev.type === 'shield') {
      ctx.globalAlpha = alpha * 0.95;
      ctx.strokeStyle = 'rgba(120, 220, 255, 0.95)';
      ctx.lineWidth = 3 * (1 - prog * 0.6);
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.85, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = alpha * 0.7;
      ctx.strokeStyle = 'rgba(200, 240, 255, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.5, 0, TWO_PI); ctx.stroke();
      const coreGrd = ctx.createRadialGradient(x, y, 0, x, y, ringR * 0.6);
      coreGrd.addColorStop(0.00, `rgba(200, 240, 255, ${alpha * 0.7})`);
      coreGrd.addColorStop(0.55, `rgba(120, 200, 255, ${alpha * 0.35})`);
      coreGrd.addColorStop(1.00, 'rgba( 60, 140, 220, 0)');
      ctx.fillStyle = coreGrd;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.6, 0, TWO_PI); ctx.fill();
    } else {
      ctx.globalAlpha = alpha * 0.85;
      ctx.strokeStyle = 'rgba(255, 150, 60, 0.95)';
      ctx.lineWidth = 3 * (1 - prog * 0.6);
      ctx.beginPath(); ctx.arc(x, y, ringR, 0, TWO_PI); ctx.stroke();
      const coreGrd = ctx.createRadialGradient(x, y, 0, x, y, ringR * 0.7);
      coreGrd.addColorStop(0.00, `rgba(255, 240, 200, ${alpha})`);
      coreGrd.addColorStop(0.45, `rgba(255, 170, 80, ${alpha * 0.6})`);
      coreGrd.addColorStop(1.00, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = coreGrd;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.7, 0, TWO_PI); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  if (mode !== 'delete' && mode !== 'satellite' && mode !== 'follow' &&
      mouseX >= 0 && !isGesturing && inGame) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(120,170,240,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 14, 0, TWO_PI); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (mode === 'delete' && hoverBody) {
    const x = SX(hoverBody.x), y = SY(hoverBody.y);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,90,90,0.95)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(x, y, 22, 0, TWO_PI); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,120,120,0.9)';
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
    ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* ===================== HUD ===================== */
const hud = document.getElementById('hud');
let __hudAccum = 0;
let __lastEnergyText = '—';
let __lastEnergyCalc = -1;

function updateHUD() {
  if (!inGame) { hud.innerHTML = ''; return; }

  let ns = 0, np = 0, na = 0, nm = 0;
  let aliveCount = 0, gestatingCount = 0, habitableCount = 0;

  for (const b of bodies) {
    if (b.kind === 'star') ns++;
    else if (b.kind === 'planet') {
      np++;
      if (b.lifeStage === 'alive') aliveCount++;
      else if (b.lifeStage === 'gestating') gestatingCount++;
      if (isInHabitableZoneSimple(b)) habitableCount++;
    }
    else if (b.kind === 'asteroid') na++;
    else nm++;
  }

  let energyStr = __lastEnergyText;
  if (!bodies.length) {
    energyStr = '—';
  } else if (__e0Pending || !__e0Initialized) {
    energyStr = '建立中…';
  } else if (simTime - __lastEnergyCalc > 0.5 || __lastEnergyCalc < 0) {
    const E = totalEnergy();
    const abs = Math.abs(E - E0);
    const absE0 = Math.abs(E0);
    if (absE0 > 1e-3) {
      const rel = abs / absE0 * 100;
      energyStr = `${abs.toFixed(3)} (${rel.toFixed(1)}%)`;
    } else {
      energyStr = abs.toFixed(3);
    }
    __lastEnergyText = energyStr;
    __lastEnergyCalc = simTime;
  }

  let lifeStr = '';
  if (np > 0) {
    lifeStr = ` <span class="k">|</span> <span class="life">生命 ${aliveCount}`;
    if (gestatingCount > 0) lifeStr += ` <span class="warn">(孕育 ${gestatingCount})</span>`;
    lifeStr += `</span>`;
    if (habitableCount > 0) lifeStr += ` <span class="k">(宜居 ${habitableCount})</span>`;
  }

  let followStr = '';
  if (selectedBody && bodies.indexOf(selectedBody) >= 0) {
    followStr = ` <span class="k">|</span> <span class="follow">跟随：${selectedBody.name}</span>`;
  }

  let saveStr = '';
  const curSave = saves.find(s => s.id === currentSaveId);
  if (curSave) saveStr = ` <span class="k">|</span> <span class="save">📁 ${curSave.name}</span>`;

  hud.innerHTML =
    `<span class="t">宇宙模拟器</span> · ` +
    `恒星 ${ns} · 行星 ${np} · 小行星 ${na} · 卫星 ${nm}<br>` +
    `<span class="k">t =</span> ${simTime.toFixed(2)} ` +
    `<span class="k">| 速度</span> ${speed.toFixed(1)}× ` +
    `<span class="k">| 缩放</span> ${userZoom.toFixed(2)}× ` +
    `<span class="k">| ΔE</span> ${energyStr}` +
    lifeStr + followStr + saveStr +
    (paused ? ' <span class="k">| 已暂停</span>' : '') +
    (mode === 'delete' ? ' <span class="k">| 删除模式</span>' : '') +
    (mode === 'satellite' ? ' <span class="k">| 点天体加卫星</span>' : '') +
    (mode === 'follow' ? ' <span class="k">| 点天体跟随</span>' : '') +
    (showHabitableZone ? ' <span class="k">| 宜居带 ON</span>' : '');
}

const toastEl = document.getElementById('toast');

  toastEl.textContent = msg;

/* ===================== 存档系统 ===================== */
const SAVE_KEY = 'cosmic-sandbox-saves-v1';
let saves = [];

function loadSavesFromStorage() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { saves = []; return; }
    const arr = JSON.parse(raw);
    saves = Array.isArray(arr) ? arr : [];
  } catch (e) { console.warn('存档读取失败', e); saves = []; }
}

function writeSavesToStorage() {
  try {
    const json = JSON.stringify(saves);
    if (json.length > 2 * 1024 * 1024) {
      showToast('存档总大小超过 2M 字符，请删除部分旧存档', true);
      return false;
    }
    localStorage.setItem(SAVE_KEY, json);
    return true;
  } catch (e) {
    console.warn('存档写入失败', e);
    const msg = (e && e.name === 'QuotaExceededError')
      ? '浏览器存储空间已满，请清理部分旧存档'
      : (e && e.message) || '未知错误';
    showToast('存档写入失败：' + msg, true);
    return false;
  }
}

/* ★ 轨迹降采样 + 量化 */
function sampleTrail(trail, maxPoints) {
  const totalPts = Math.floor(trail.length / 2);
  if (totalPts <= maxPoints) {
    const out = new Array(trail.length);
    for (let i = 0; i < trail.length; i++) out[i] = Math.round(trail[i] * 1000) / 1000;
    return out;
  }
  const step = totalPts / maxPoints;
  const out = [];
  for (let i = 0; i < maxPoints; i++) {
    const idx = Math.floor(i * step) * 2;
    out.push(Math.round(trail[idx] * 1000) / 1000);
    out.push(Math.round(trail[idx + 1] * 1000) / 1000);
  }
  return out;
}

function serializeState() {
  const indexMap = new Map();
  bodies.forEach((b, i) => indexMap.set(b, i));
  const serializedBodies = bodies.map(b => ({
    kind: b.kind, typeKey: b.typeKey, name: b.name, m: b.m,
    x: b.x, y: b.y, vx: b.vx, vy: b.vy,
    sizeMul: b.sizeMul, rMul: b.rMul, water: b.water, rgb: b.rgb.slice(),
    trail: sampleTrail(b.trail, 30),
    hostIndex: b.host ? indexMap.get(b.host) : -1,
    orbitRadius: b.orbitRadius, orbitPhase: b.orbitPhase, orbitAngularSpeed: b.orbitAngularSpeed,
    life: b.life, lifeStage: b.lifeStage, gestationTimer: b.gestationTimer,
    flash: b.flash, flashColor: b.flashColor,
  }));
  return {
    version: 1, simTime,
    camX, camY, camScale,
    userZoom, userPanX, userPanY,
    showHabitableZone,
    selectedBodyIndex: selectedBody ? indexMap.get(selectedBody) : -1,
    bodies: serializedBodies,
  };
}

function deserializeState(data) {
  if (!data || !Array.isArray(data.bodies)) throw new Error('存档数据格式不正确');
  bodies = data.bodies.map(s => ({
    kind: s.kind, typeKey: s.typeKey, name: s.name, m: s.m,
    x: s.x, y: s.y, vx: s.vx || 0, vy: s.vy || 0, ax: 0, ay: 0,
    sizeMul: s.sizeMul, rMul: s.rMul || 1, water: !!s.water,
    rgb: (s.rgb || [200,200,200]).slice(), trail: (s.trail || [s.x, s.y]).slice(),
    host: null,
    orbitRadius: s.orbitRadius || 0, orbitPhase: s.orbitPhase || 0, orbitAngularSpeed: s.orbitAngularSpeed || 0,
    life: s.life || 0, lifeStage: s.lifeStage || 'barren', gestationTimer: s.gestationTimer || 0,
    flash: s.flash || 0, flashColor: s.flashColor || null,
  }));
  data.bodies.forEach((s, i) => {
    if (s.hostIndex >= 0 && bodies[s.hostIndex]) bodies[i].host = bodies[s.hostIndex];
  });
  simTime = data.simTime || 0;
  prevSimTime = simTime;
  nextSample = SAMPLE_DT; acc = 0;
  camX = data.camX || 0; camY = data.camY || 0; camScale = data.camScale || 220;
  camTarget.x = camX; camTarget.y = camY; camTarget.s = camScale;
  userZoom = data.userZoom || 1;
  userPanX = data.userPanX || 0;
  userPanY = data.userPanY || 0;
  smoothMaxD = 0.6;
  showHabitableZone = !!data.showHabitableZone;
  document.getElementById('btnHabitable').classList.toggle('active', showHabitableZone);
  selectedBody = (data.selectedBodyIndex >= 0 && bodies[data.selectedBodyIndex]) ? bodies[data.selectedBodyIndex] : null;
  impactEvents = [];
  computeAccel();
  /* ★ 加载存档后立即锁定 E0 基准，不走延迟 */
  E0 = totalEnergy();
  __e0Initialized = true;
  __e0Pending = false; __e0DelayTimer = 0;
  __lastEnergyCalc = -1;
  document.getElementById('btnPause').textContent = paused ? '继续' : '暂停';
  lastT = performance.now();
}

function genId() {
  return 'save_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function fmtTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveCurrent() {
  if (!currentSaveId) { saveAsNew(); return; }
  const save = saves.find(s => s.id === currentSaveId);
  if (!save) { saveAsNew(); return; }
  save.state = serializeState();
  save.savedAt = Date.now();
  if (writeSavesToStorage()) {
    showToast('已保存：' + save.name);
    renderSaveList();
  }
}

function saveAsNew() {
  const defaultName = '宇宙 ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const name = prompt('另存为新存档，起个名字：', defaultName);
  if (name === null) return;
  const finalName = (name || '').trim() || defaultName;
  const save = { id: genId(), name: finalName, savedAt: Date.now(), state: serializeState() };
  saves.push(save);
  if (writeSavesToStorage()) {
    currentSaveId = save.id;
    renderSaveList();
    showToast('已另存为：' + finalName);
  } else { saves.pop(); }
}

function createEmptyUniverse() {
  const defaultName = '新宇宙 ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const name = prompt('给这个新宇宙起个名字：', defaultName);
  if (name === null) return;
  const finalName = (name || '').trim() || defaultName;

  bodies = [];
  impactEvents = [];
  selectedBody = null;
  simTime = 0; prevSimTime = 0;
  nextSample = SAMPLE_DT; acc = 0; E0 = 0;
  __e0Initialized = false; __e0Pending = false; __e0DelayTimer = 0;
  __lastEnergyCalc = -1;
  camX = 0; camY = 0; camScale = 220;
  camTarget.x = 0; camTarget.y = 0; camTarget.s = 220;
  userZoom = 1; userPanX = 0; userPanY = 0;
  smoothMaxD = 0.6;

  const save = { id: genId(), name: finalName, savedAt: Date.now(), state: serializeState() };
  saves.push(save);
  if (writeSavesToStorage()) {
    showToast('已创建：' + finalName);
    enterGame(save.id);
  } else { saves.pop(); }
}

function loadSave(id) {
  const save = saves.find(s => s.id === id);
  if (!save) return;
  if (inGame && currentSaveId === id) { showToast('已经是这个存档了'); return; }
  if (inGame) {
    if (!confirm(`确定加载「${save.name}」吗？当前未保存的内容会丢失。`)) return;
  }
  try {
    deserializeState(save.state);
    showToast('已加载：' + save.name);
    enterGame(save.id);
  } catch (e) { showToast('加载失败：' + e.message, true); }
}

function deleteSave(id) {
  const idx = saves.findIndex(s => s.id === id);
  if (idx < 0) return;
  const save = saves[idx];
  if (!confirm(`确定删除「${save.name}」吗？此操作不可撤销。`)) return;
  saves.splice(idx, 1);
  if (currentSaveId === id) currentSaveId = null;
  writeSavesToStorage();
  renderSaveList();
  showToast('已删除：' + save.name);
}

async function exportSave(id) {
  const save = saves.find(s => s.id === id);
  if (!save) return;
  const payload = { format: 'cosmic-sandbox-save', version: 1, exportedAt: Date.now(), save };
  const data = JSON.stringify(payload);

  const safeName = (save.name || 'save').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'save';
  const filename = `宇宙模拟器_${safeName}.json`;

  try {
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '宇宙模拟器存档', text: save.name });
      showToast('已导出：' + safeName);
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    console.warn('Web Share 失败', err);
  }

  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => {
      try { document.body.removeChild(a); } catch (_) {}
      URL.revokeObjectURL(url);
    }, 500);
    showToast('已导出：' + safeName);
    return;
  } catch (err) { console.warn('Blob 失败', err); }

  try {
    const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { try { document.body.removeChild(a); } catch (_) {} }, 500);
    showToast('已导出：' + safeName);
    return;
  } catch (err) { console.warn('DataURL 失败', err); }

  try {
    const w = window.open('', '_blank');
    if (w) {
      w.document.write(
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + filename + '</title>' +
        '<style>body{background:#0a1018;color:#c3cede;font:12px ui-monospace,monospace;padding:16px;}' +
        'pre{white-space:pre-wrap;word-break:break-all;background:#10151d;padding:12px;border-radius:8px;' +
        'border:1px solid #1a2332;user-select:text;-webkit-user-select:text;}</style></head><body>' +
        '<h3 style="color:#e8eef6;">存档文件内容</h3>' +
        '<p style="color:#8d9aab;">请长按下方内容全选复制，粘贴到文本编辑器保存为 .json 文件。</p>' +
        '<pre>' + data.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre></body></html>'
      );
      w.document.close();
      showToast('已在新窗口显示内容，请手动保存');
    } else {
      showToast('导出失败：浏览器阻止了下载与弹窗', true);
    }
  } catch (err) { showToast('导出失败：' + err.message, true); }
}

function importSaveFromFile(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { showToast('文件过大（>8MB），无法导入', true); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      let save = null;
      if (data && data.save && data.save.state) save = data.save;
      else if (data && data.state && data.state.bodies) save = data;
      else throw new Error('文件格式不正确');
      if (!save.state || !Array.isArray(save.state.bodies)) throw new Error('存档内容损坏');
      const newSave = { id: genId(), name: (save.name || '导入的存档').toString().slice(0, 60), savedAt: Date.now(), state: save.state };
      saves.push(newSave);
      if (writeSavesToStorage()) {
        renderSaveList();
        showToast('已导入：' + newSave.name);
        try {
          deserializeState(newSave.state);
          enterGame(newSave.id);
        } catch (e) { showToast('导入成功但加载失败：' + e.message, true); }
      } else { saves.pop(); }
    } catch (e) { showToast('导入失败：' + e.message, true); }
  };
  reader.onerror = () => showToast('文件读取失败', true);
  reader.readAsText(file);
}

function renderSaveList() {
  const list = document.getElementById('saveList');
  list.innerHTML = '';
  if (!saves.length) {
    const empty = document.createElement('div');
    empty.className = 'save-empty';
    empty.textContent = inGame ? '还没有存档' : '还没有存档，点下面「＋ 新建宇宙」开始吧';
    list.appendChild(empty);
    return;
  }
  const sorted = saves.slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  for (const save of sorted) {
    const isCurrent = inGame && save.id === currentSaveId;
    const item = document.createElement('div');
    item.className = 'save-item' + (isCurrent ? ' current' : '');
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = save.name;
    if (isCurrent) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '当前';
      name.appendChild(badge);
    }
    const meta = document.createElement('span');
    meta.className = 'meta';
    const bodyCount = save.state && Array.isArray(save.state.bodies) ? save.state.bodies.length : 0;
    meta.textContent = `${bodyCount} 个天体 · ${fmtTime(save.savedAt || 0)}`;
    info.appendChild(name); info.appendChild(meta);

    const acts = document.createElement('div');
    acts.className = 'acts';
    if (isCurrent) {
      const sb = document.createElement('button');
      sb.className = 'btn-save';
      sb.textContent = '💾 保存';
      sb.addEventListener('click', ev => { ev.stopPropagation(); saveCurrent(); });
      acts.appendChild(sb);
    } else {
      const lb = document.createElement('button');
      lb.className = 'btn-load';
      lb.textContent = '▶ 加载';
      lb.addEventListener('click', ev => { ev.stopPropagation(); loadSave(save.id); });
      acts.appendChild(lb);
    }
    const eb = document.createElement('button');
    eb.className = 'btn-export';
    eb.textContent = '⬇ 导出';
    eb.addEventListener('click', ev => { ev.stopPropagation(); exportSave(save.id); });
    acts.appendChild(eb);
    const db = document.createElement('button');
    db.className = 'btn-del';
    db.textContent = '✕ 删除';
    db.addEventListener('click', ev => { ev.stopPropagation(); deleteSave(save.id); });
    acts.appendChild(db);

    item.appendChild(info); item.appendChild(acts);
    list.appendChild(item);
  }
}

/* ===================== 键盘快捷键 ===================== */
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName ? e.target.tagName : '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
  const modalOpen = document.getElementById('saveModal').classList.contains('open');
  const isStartup = document.getElementById('saveModal').classList.contains('startup');
  if (isStartup) return;
  if (modalOpen) {
    if (e.key === 'Escape') closeSaveModal();
    return;
  }
  if (!inGame) return;
  const key = e.key;

  if (key === ' ') { e.preventDefault(); togglePause(); return; }
  if (key === 'r' || key === 'R') { resetView(); selectedBody = null; return; }
  if (key === 'h' || key === 'H') {
    showHabitableZone = !showHabitableZone;
    document.getElementById('btnHabitable').classList.toggle('active', showHabitableZone);
    return;
  }
  if ((key === 's' || key === 'S') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); saveCurrent(); return;
  }
  if (key === 'f' || key === 'F') { setMode('follow'); return; }
  if (key === '1') { setMode('star');      return; }
  if (key === '2') { setMode('planet');    return; }
  if (key === '3') { setMode('asteroid');  return; }
  if (key === '4') { setMode('satellite'); return; }
  if (key === '5') { setMode('follow');    return; }
  if (key === '6') { setMode('delete');    return; }

  if (key === 'Delete' || key === 'Backspace') {
    if (selectedBody) { e.preventDefault(); deleteBody(selectedBody); }
    return;
  }
  if (key === 'Escape') { selectedBody = null; return; }
  if (key === '=' || key === '+' || key === 'Add') { e.preventDefault(); zoomBy(1.25); return; }
  if (key === '-' || key === '_' || key === 'Subtract') { e.preventDefault(); zoomBy(1/1.25); return; }
  if (key === 'ArrowUp')    { e.preventDefault(); panByKey( 0,  1); return; }
  if (key === 'ArrowDown')  { e.preventDefault(); panByKey( 0, -1); return; }
  if (key === 'ArrowLeft')  { e.preventDefault(); panByKey(-1,  0); return; }
  if (key === 'ArrowRight') { e.preventDefault(); panByKey( 1,  0); return; }
});

/* ===================== 画布手势交互 ===================== */
const activePointers = new Map();
let panState   = null;
let pinchState = null;
let isGesturing = false;

function refreshGesturing() { isGesturing = activePointers.size > 0; }

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  if (!inGame) return;
  if (e.target !== canvas) return;
  const isPanButton = (e.button === 1 || e.button === 2);
  activePointers.set(e.pointerId, {
    id: e.pointerId, button: e.button,
    x: e.clientX, y: e.clientY,
    startX: e.clientX, startY: e.clientY,
    startTime: performance.now(),
    moved: isPanButton, isPan: isPanButton
  });
  refreshGesturing();
  updateCursor();

  if (activePointers.size === 1) {
    const p = activePointers.get(e.pointerId);
    panState = { startCamX: camX, startCamY: camY, startScale: camScale, startX: p.startX, startY: p.startY };
    pinchState = null;
  } else if (activePointers.size === 2) {
    const [a, b] = [...activePointers.values()];
    const cx = (a.x + b.x) * 0.5;
    const cy = (a.y + b.y) * 0.5;
    pinchState = {
      startDist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      startScale: camScale,
      anchorWX: camX + (cx - W * 0.5) / camScale,
      anchorWY: camY - (cy - H * 0.5) / camScale
    };
    panState = null;
  }
});

canvas.addEventListener('pointermove', e => {
  if (!inGame) return;
  if (e.pointerType === 'mouse') { mouseX = e.clientX; mouseY = e.clientY; }
  const p = activePointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  const ddx = p.x - p.startX, ddy = p.y - p.startY;
  if (!p.moved && Math.hypot(ddx, ddy) > 8) p.moved = true;

  if (activePointers.size === 1 && panState) {
    /* ★ 微动不平移，避免"点一下"时相机偏移 */
    if (!p.moved) return;
    const dx = p.x - panState.startX;
    const dy = p.y - panState.startY;
    const newCamX = panState.startCamX - dx / panState.startScale;
    const newCamY = panState.startCamY + dy / panState.startScale;
    const ref = getRefPoint();
    userPanX = newCamX - ref.x;
    userPanY = newCamY - ref.y;
    camX = camTarget.x = newCamX;
    camY = camTarget.y = newCamY;
  } else if (activePointers.size === 2 && pinchState) {
    const [a, b] = [...activePointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const factor = dist / pinchState.startDist;
    const rawScale = pinchState.startScale * factor;
    /* ★ 用纯函数 computeBaseScale，避免副作用 */
    const base = computeBaseScale();
    userZoom = clampUserZoom(rawScale / base);
    const actualScale = base * userZoom;
    const cx = (a.x + b.x) * 0.5;
    const cy = (a.y + b.y) * 0.5;
    const newCamX = pinchState.anchorWX - (cx - W * 0.5) / actualScale;
    const newCamY = pinchState.anchorWY + (cy - H * 0.5) / actualScale;
    const ref = getRefPoint();
    userPanX = newCamX - ref.x;
    userPanY = newCamY - ref.y;
    camX = camTarget.x = newCamX;
    camY = camTarget.y = newCamY;
    camScale = camTarget.s = actualScale;
  }
});

function releasePointer(e) {
  const p = activePointers.get(e.pointerId);
  if (!p) return;
  activePointers.delete(e.pointerId);
  refreshGesturing();
  updateCursor();

  if (p && !p.moved && !p.isPan && activePointers.size === 0 &&
      performance.now() - p.startTime < 500 && inGame) {
    handleClick(e.clientX, e.clientY);
  }
  if (activePointers.size === 0) {
    panState = null; pinchState = null;
  } else if (activePointers.size === 1) {
    const rem = [...activePointers.values()][0];
    panState = { startCamX: camX, startCamY: camY, startScale: camScale, startX: rem.x, startY: rem.y };
    pinchState = null;
    rem.moved = true;
  }
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

function handleClick(px, py) {
  if (mode === 'delete') {
    const target = findBodyAtScreen(px, py);
    if (target) deleteBody(target);
    return;
  }
  if (mode === 'follow') {
    const target = findBodyAtScreen(px, py);
    if (target) selectedBody = (selectedBody === target) ? null : target;
    else selectedBody = null;
    return;
  }
  const wx = camX + (px - W * 0.5) / camScale;
  const wy = camY - (py - H * 0.5) / camScale;
  if (mode === 'satellite') {
    const host = findHostForSatellite(px, py);
    if (!host) return;
    placeBody('satellite', catType.satellite, sizeMul, wx, wy, 'orbit', host);
  } else {
    placeBody(mode, catType[mode], sizeMul, wx, wy, placeMotion);
  }
  lastT = performance.now();
}

canvas.addEventListener('wheel', e => {
  if (!inGame) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const mx = e.clientX, my = e.clientY;
  const wx = camX + (mx - W * 0.5) / camScale;
  const wy = camY - (my - H * 0.5) / camScale;
  /* ★ 用纯函数 computeBaseScale，避免副作用 */
  const base = computeBaseScale();
  userZoom = clampUserZoom(userZoom * factor);
  const newScale = base * userZoom;
  const newCamX = wx - (mx - W * 0.5) / newScale;
  const newCamY = wy + (my - H * 0.5) / newScale;
  const ref = getRefPoint();
  userPanX = newCamX - ref.x;
  userPanY = newCamY - ref.y;
  camX = camTarget.x = newCamX;
  camY = camTarget.y = newCamY;
  camScale = camTarget.s = newScale;
}, { passive: false });

canvas.addEventListener('pointerleave', e => {
  if (e.pointerType === 'mouse') { mouseX = -1; mouseY = -1; hoverBody = null; }
});

/* ===================== 主循环 ===================== */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (!inGame) return;

  if (!paused && bodies.length) {
    acc += dt * speed;
    const maxStepsThisFrame = Math.min(MAX_STEPS, Math.ceil(acc / BASE_STEP) + 5);
    let steps = 0;
    let mergeCount = 0;
    
    while (acc >= BASE_STEP && steps < maxStepsThisFrame) {
      if (cachedMinD < OVERLAP_CHECK_DIST && mergeCount < 20) {
        if (checkOverlapMerge()) {
          computeAccel();
          mergeCount++;
          continue;
        }
      }
      const usedH = vvStep();
      acc -= usedH;
      simTime += usedH;
      steps++;
      /* ★ Bug 2 修复：stepsSinceImpactCheck 已移至模块级，跨帧累积 */
      stepsSinceImpactCheck++;

      /* ★ 每 10 个物理步做一次碰撞检测，防止高速小行星穿透行星 */
      if (stepsSinceImpactCheck >= 10) {
        resolveCollisions();
        stepsSinceImpactCheck = 0;
      }

      if (simTime >= nextSample) {
        sampleTrails();
        /* ★ 用 simTime 重置，避免一帧跨多个 SAMPLE_DT 时重复采样同一位置 */
        nextSample = simTime + SAMPLE_DT;
      }
    }
    if (acc > BASE_STEP * MAX_STEPS) acc = BASE_STEP * MAX_STEPS;
    const simDt = simTime - prevSimTime;
    prevSimTime = simTime;
    if (simDt > 0) updateLife(simDt);
  } else {
    prevSimTime = simTime;
  }

  /* ★ E0 延迟建立：只在"空宇宙放第一个天体"后触发 */
  if (__e0Pending) {
    __e0DelayTimer += dt;
    if (__e0DelayTimer > 0.5) {
      E0 = totalEnergy();
      __e0Initialized = true;
      __e0Pending = false;
      __lastEnergyCalc = -1;
    }
  }

  updateCamera(dt);
  render();
  __hudAccum += dt;
  if (__hudAccum > 0.15) { __hudAccum = 0; updateHUD(); }
}

/* ===================== 启动 ===================== */
resize();
setMode('star');
buildTypeButtons();
updateCursor();
loadSavesFromStorage();
openSaveModal(true);
requestAnimationFrame(frame);
</script>
