/* ===================== 存档系统 ===================== */
const SAVE_KEY = 'cosmic-sandbox-saves-v1';
let saves = [];

function loadSavesFromStorage() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { saves = []; return; }
    const arr = JSON.parse(raw);
    saves = Array.isArray(arr) ? arr.filter(s => s && typeof s === 'object' && typeof s.id === 'string') : [];
  } catch (e) { console.warn('存档读取失败', e); saves = []; }
}

function writeSavesToStorage() {
  try {
    const json = JSON.stringify(saves);
    if (json.length > 2 * 1024 * 1024) {
      showToast('存档总大小超过 2M 字符，请删除部分旧存档', true);
      return false;
    }
    localStorage.setItem(SAVE_KEY, json);
    return true;
  } catch (e) {
    console.warn('存档写入失败', e);
    const msg = (e && e.name === 'QuotaExceededError')
      ? '浏览器存储空间已满，请清理部分旧存档'
      : (e && e.message) || '未知错误';
    showToast('存档写入失败：' + msg, true);
    return false;
  }
}

/* ★ 轨迹降采样 + 量化 */
function sampleTrail(trail, maxPoints) {
  const totalPts = Math.floor(trail.length / 2);
  if (totalPts <= maxPoints) {
    const out = new Array(trail.length);
    for (let i = 0; i < trail.length; i++) out[i] = Math.round(trail[i] * 1000) / 1000;
    return out;
  }
  const step = totalPts / maxPoints;
  const out = [];
  for (let i = 0; i < maxPoints; i++) {
    const idx = Math.floor(i * step) * 2;
    out.push(Math.round(trail[idx] * 1000) / 1000);
    out.push(Math.round(trail[idx + 1] * 1000) / 1000);
  }
  return out;
}

/* ★ 反序列化校验：存档/导入的 JSON 不再被直接信任
   （以前只要 kind/typeKey 写错就会抛异常，rgb 不是数组会渲染成 rgb(NaN)，
     hostIndex 指向自己会让卫星自引用而漂走） */
function sanitizeBodyStates(list) {
  const out = [];
  const rawToNew = new Map();
  list.forEach((s, idx) => {
    if (!s || typeof s !== 'object' || !isCategory(s.kind)) return;
    const table = CATEGORIES[s.kind].types;
    let typeKey = s.typeKey;
    if (typeof typeKey !== 'string' || !Object.prototype.hasOwnProperty.call(table, typeKey)) {
      typeKey = Object.keys(table)[0];
    }
    const t = table[typeKey];
    const trailIn = Array.isArray(s.trail) ? s.trail.filter(v => Number.isFinite(v)) : [];
    let trail = trailIn.length >= 2 ? trailIn.slice(-120) : [numOr(s.x, 0), numOr(s.y, 0)];
    if (trail.length % 2) trail = trail.slice(0, trail.length - 1);
    if (trail.length < 2) trail = [numOr(s.x, 0), numOr(s.y, 0)];
    const rgbIn = (Array.isArray(s.rgb) && s.rgb.length >= 3) ? s.rgb.slice(0, 3) : t.rgb;
    const flashIn = (Array.isArray(s.flashColor) && s.flashColor.length >= 3) ? s.flashColor.slice(0, 3) : null;
    rawToNew.set(idx, out.length);
    out.push({
      kind: s.kind, typeKey,
      name: (typeof s.name === 'string' && s.name.trim()) ? s.name.trim().slice(0, 40) : t.name,
      /* ★ 修复：存档里的物理量必须有绝对值上限，否则损坏/恶意存档
         能把位置与速度打成 Infinity，整个模拟直接废掉 */
      m: clampAbs(Math.max(numOr(s.m, t.mass), 1e-12), MAX_SAVE_MASS),
      x: clampAbs(numOr(s.x, 0), MAX_SAVE_POS), y: clampAbs(numOr(s.y, 0), MAX_SAVE_POS),
      vx: clampAbs(numOr(s.vx, 0), MAX_SAVE_SPEED), vy: clampAbs(numOr(s.vy, 0), MAX_SAVE_SPEED),
      ax: 0, ay: 0,
      sizeMul: clampNum(numOr(s.sizeMul, 1), 0.2, 6),
      rMul: Math.max(numOr(s.rMul, t.rMul || 1), 0.1),
      water: (s.water === undefined) ? !!t.water : !!s.water,
      rgb: rgbIn.map(c => Math.round(clampNum(c, 0, 255))),
      trail,
      host: null,
      orbitRadius: Math.max(0, numOr(s.orbitRadius, 0)),
      orbitPhase: numOr(s.orbitPhase, 0),
      orbitAngularSpeed: Math.max(0, numOr(s.orbitAngularSpeed, 0)),
      life: clampNum(numOr(s.life, 0), 0, 1),
      lifeStage: (s.lifeStage === 'alive' || s.lifeStage === 'gestating') ? s.lifeStage : 'barren',
      gestationTimer: Math.max(0, numOr(s.gestationTimer, 0)),
      flash: clampNum(numOr(s.flash, 0), 0, 1),
      flashColor: flashIn ? flashIn.map(c => Math.round(clampNum(c, 0, 255))) : null,
    });
  });
  return { bodies: out, rawToNew };
}

function serializeState() {
  const indexMap = new Map();
  bodies.forEach((b, i) => indexMap.set(b, i));
  const serializedBodies = bodies.map(b => ({
    kind: b.kind, typeKey: b.typeKey, name: b.name, m: b.m,
    x: b.x, y: b.y, vx: b.vx, vy: b.vy,
    sizeMul: b.sizeMul, rMul: b.rMul, water: b.water, rgb: b.rgb.slice(),
    trail: sampleTrail(b.trail, 30),
    hostIndex: b.host ? indexMap.get(b.host) : -1,
    orbitRadius: b.orbitRadius, orbitPhase: b.orbitPhase, orbitAngularSpeed: b.orbitAngularSpeed,
    life: b.life, lifeStage: b.lifeStage, gestationTimer: b.gestationTimer,
    flash: b.flash, flashColor: b.flashColor,
  }));
  return {
    version: 1, simTime,
    camX, camY, camScale,
    userZoom, userPanX, userPanY,
    showHabitableZone,
    /* ★ 修复：界面/模拟状态一起存，避免"读档后速度、暂停、模式跟存档不一致" */
    speed, sizeMul, placeMotion, paused, mode,
    catType: { star: catType.star, planet: catType.planet, asteroid: catType.asteroid, satellite: catType.satellite, blackhole: catType.blackhole },
    selectedBodyIndex: selectedBody ? indexMap.get(selectedBody) : -1,
    /* ★ 新增：相机是否在跟随，随存档一起保存 */
    followCam: !!followCam,
    bodies: serializedBodies,
  };
}

function deserializeState(data) {
  if (!data || !Array.isArray(data.bodies)) throw new Error('存档数据格式不正确');
  const parsed = sanitizeBodyStates(data.bodies);
  bodies = parsed.bodies;

  /* ★ 卫星宿主重建：只接受合法索引，禁止自引用，宿主必须是恒星或行星 */
  data.bodies.forEach((s, i) => {
    if (!s || typeof s !== 'object') return;
    const hi = s.hostIndex;
    if (!Number.isInteger(hi) || hi === i) return;
    const from = parsed.rawToNew.get(i);
    const to = parsed.rawToNew.get(hi);
    if (from === undefined || to === undefined) return;
    const sat = bodies[from], host = bodies[to];
    if (!sat || !host || sat.kind !== 'satellite') return;
    if (host.kind !== 'star' && host.kind !== 'planet' && host.kind !== 'blackhole') return;
    const ddx = sat.x - host.x, ddy = sat.y - host.y;
    const dist = Math.hypot(ddx, ddy);
    sat.host = host;
    sat.orbitRadius = Math.max(0.05, dist);
    sat.orbitPhase = dist > 1e-6 ? Math.atan2(ddy, ddx) : numOr(sat.orbitPhase, 0);
    if (!(sat.orbitAngularSpeed > 0)) {
      const vPhys = Math.sqrt(G * Math.max(host.m, 1e-9) / sat.orbitRadius);
      sat.orbitAngularSpeed = (vPhys / sat.orbitRadius) * SATELLITE_SPEED_MUL;
    }
  });
  /* ★ 宿主丢失的卫星直接丢弃，否则会永远静止悬在原地 */
  /* ★ 修复：selectedBodyIndex 存的是"原始数组下标"，而 sanitize 可能丢弃非法条目、
     上面的 filter 又可能再剔掉无宿主卫星 —— 下标会错位。这里先用 rawToNew 映射成
     真正的天体对象，最后再校验它是否还活着。 */
  const __selRaw = Number.isInteger(data.selectedBodyIndex) ? data.selectedBodyIndex : -1;
  const __selBody = (__selRaw >= 0 && parsed.rawToNew.has(__selRaw))
    ? bodies[parsed.rawToNew.get(__selRaw)] : null;
  bodies = bodies.filter(b => b.kind !== 'satellite' || b.host);

  simTime = Math.max(0, numOr(data.simTime, 0));
  prevSimTime = simTime;
  nextSample = simTime + SAMPLE_DT;
  acc = 0;
  stepsSinceImpactCheck = 0;
  camX = numOr(data.camX, 0);
  camY = numOr(data.camY, 0);
  camScale = clampCamScale(Math.max(0.5, numOr(data.camScale, 220)));
  camTarget.x = camX; camTarget.y = camY; camTarget.s = camScale;
  userZoom = clampUserZoom(numOr(data.userZoom, 1));
  userPanX = numOr(data.userPanX, 0);
  userPanY = numOr(data.userPanY, 0);
  /* ★ 读档后重新开启自动取景，并按新系统立刻定好取景半径 */
  resetAutoFit();
  impactEvents = [];
  hoverBody = null;

  if (data.catType && typeof data.catType === 'object') {
    for (const k of CATEGORY_KEYS) {
      const v = data.catType[k];
      if (typeof v === 'string' && Object.prototype.hasOwnProperty.call(CATEGORIES[k].types, v)) catType[k] = v;
    }
  }
  setMode(isMode(data.mode) ? data.mode : 'star');
  setHabitableZone(!!data.showHabitableZone);
  setSpeed(numOr(data.speed, 1));
  setSizeMul(numOr(data.sizeMul, 1));
  setMotion(data.placeMotion === 'static' ? 'static' : 'orbit');

  selectedBody = (__selBody && bodies.indexOf(__selBody) >= 0) ? __selBody : null;
  /* ★ 修复：以前「有选中就跟随」，于是读档后相机会自动锁到存档里选中的那颗天体上，
     视角从此自己跟着它跑。现在只有这个存档本身处于跟随时才恢复跟随；
     旧存档没有 followCam 字段 → 默认不跟随（选中环仍然显示）。 */
  followCam = !!data.followCam && !!selectedBody;
  __lifeAccum = 0;

  computeAccel();
  /* ★ 加载存档后立即锁定 E0 基准，不走延迟 */
  E0 = totalEnergy();
  __e0Initialized = true;
  __e0Pending = false; __e0DelayTimer = 0;
  __lastEnergyCalc = -1;
  __lastEnergyText = '—';
  setPaused(!!data.paused);
  lastT = performance.now();
}

function genId() {
  return 'save_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function fmtTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveCurrent() {
  if (!currentSaveId) { saveAsNew(); return; }
  const save = saves.find(s => s.id === currentSaveId);
  if (!save) { saveAsNew(); return; }
  let state;
  try { state = serializeState(); }
  catch (e) { showToast('保存失败：' + e.message, true); return; }

  const prevState = save.state, prevAt = save.savedAt;
  save.state = state;
  save.savedAt = Date.now();
  if (writeSavesToStorage()) {
    showToast('已保存：' + save.name);
    renderSaveList();
  } else {
    /* ★ 修复：写盘失败就把内存回滚，否则列表时间变了、内容却没存上 */
    save.state = prevState;
    save.savedAt = prevAt;
    renderSaveList();
  }
}

function saveAsNew() {
  const defaultName = '宇宙 ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const name = prompt('另存为新存档，起个名字：', defaultName);
  if (name === null) return;
  const finalName = (name || '').trim() || defaultName;
  let state;
  try { state = serializeState(); }
  catch (e) { showToast('保存失败：' + e.message, true); return; }
  const save = { id: genId(), name: finalName, savedAt: Date.now(), state };
  saves.push(save);
  if (writeSavesToStorage()) {
    currentSaveId = save.id;
    renderSaveList();
    showToast('已另存为：' + finalName);
  } else { saves.pop(); }
}

/* ★ 重置模拟与界面：新建宇宙 / 退出首页 共用，避免各自漏重置
   （以前这里漏了 paused，暂停后退出再新建会得到一个"冻住"的宇宙） */
function clearSimulation() {
  resetWorldState();
  setPaused(false);
  setSpeed(1);
  setSizeMul(1);
  setMotion('orbit');
  setMode('star');
  setHabitableZone(false);
  hud.innerHTML = '';
}

function createEmptyUniverse() {
  const defaultName = '新宇宙 ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const name = prompt('给这个新宇宙起个名字：', defaultName);
  if (name === null) return;
  const finalName = (name || '').trim() || defaultName;

  clearSimulation();

  let state;
  try { state = serializeState(); }
  catch (e) { showToast('创建失败：' + e.message, true); return; }
  const save = { id: genId(), name: finalName, savedAt: Date.now(), state };
  saves.push(save);
  if (writeSavesToStorage()) {
    showToast('已创建：' + finalName);
    enterGame(save.id);
  } else { saves.pop(); }
}

function loadSave(id) {
  const save = saves.find(s => s.id === id);
  if (!save) return;
  if (inGame && currentSaveId === id) { showToast('已经是这个存档了'); return; }
  if (inGame) {
    if (!confirm(`确定加载「${save.name}」吗？当前未保存的内容会丢失。`)) return;
  }
  try {
    deserializeState(save.state);
    showToast('已加载：' + save.name);
    enterGame(save.id);
  } catch (e) { showToast('加载失败：' + e.message, true); }
}

function deleteSave(id) {
  const idx = saves.findIndex(s => s.id === id);
  if (idx < 0) return;
  const save = saves[idx];
  if (!confirm(`确定删除「${save.name}」吗？此操作不可撤销。`)) return;
  saves.splice(idx, 1);
  if (!writeSavesToStorage()) {
    /* ★ 修复：写盘失败就把它放回去，否则界面删掉了、刷新后又"复活" */
    saves.splice(idx, 0, save);
    renderSaveList();
    return;
  }
  if (currentSaveId === id) currentSaveId = null;
  renderSaveList();
  showToast('已删除：' + save.name);
}

async function exportSave(id) {
  const save = saves.find(s => s.id === id);
  if (!save) return;
  const payload = { format: 'cosmic-sandbox-save', version: 1, exportedAt: Date.now(), save };
  const data = JSON.stringify(payload);

  const safeName = (save.name || 'save').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'save';
  const filename = `宇宙模拟器_${safeName}.json`;

  try {
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '宇宙模拟器存档', text: save.name });
      showToast('已导出：' + safeName);
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    console.warn('Web Share 失败', err);
  }

  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => {
      try { document.body.removeChild(a); } catch (_) {}
      URL.revokeObjectURL(url);
    }, 500);
    showToast('已导出：' + safeName);
    return;
  } catch (err) { console.warn('Blob 失败', err); }

  try {
    const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { try { document.body.removeChild(a); } catch (_) {} }, 500);
    showToast('已导出：' + safeName);
    return;
  } catch (err) { console.warn('DataURL 失败', err); }

  try {
    const w = window.open('', '_blank');
    if (w) {
      w.document.write(
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + filename + '</title>' +
        '<style>body{background:#0a1018;color:#c3cede;font:12px ui-monospace,monospace;padding:16px;}' +
        'pre{white-space:pre-wrap;word-break:break-all;background:#10151d;padding:12px;border-radius:8px;' +
        'border:1px solid #1a2332;user-select:text;-webkit-user-select:text;}</style></head><body>' +
        '<h3 style="color:#e8eef6;">存档文件内容</h3>' +
        '<p style="color:#8d9aab;">请长按下方内容全选复制，粘贴到文本编辑器保存为 .json 文件。</p>' +
        '<pre>' + data.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre></body></html>'
      );
      w.document.close();
      showToast('已在新窗口显示内容，请手动保存');
    } else {
      showToast('导出失败：浏览器阻止了下载与弹窗', true);
    }
  } catch (err) { showToast('导出失败：' + err.message, true); }
}

function importSaveFromFile(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { showToast('文件过大（>8MB），无法导入', true); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      let save = null;
      if (data && data.save && data.save.state) save = data.save;
      else if (data && data.state && data.state.bodies) save = data;
      else throw new Error('文件格式不正确');
      if (!save.state || !Array.isArray(save.state.bodies)) throw new Error('存档内容损坏');
      const newSave = {
        id: genId(),
        name: (save.name || '导入的存档').toString().trim().slice(0, 60) || '导入的存档',
        savedAt: Date.now(),
        state: save.state,
      };
      saves.push(newSave);
      if (writeSavesToStorage()) {
        renderSaveList();
        showToast('已导入：' + newSave.name);
        try {
          deserializeState(newSave.state);
          enterGame(newSave.id);
        } catch (e) { showToast('导入成功但加载失败：' + e.message, true); }
      } else { saves.pop(); }
    } catch (e) { showToast('导入失败：' + e.message, true); }
  };
  reader.onerror = () => showToast('文件读取失败', true);
  reader.readAsText(file);
}

function renderSaveList() {
  const list = document.getElementById('saveList');
  list.innerHTML = '';
  if (!saves.length) {
    const empty = document.createElement('div');
    empty.className = 'save-empty';
    empty.textContent = inGame ? '还没有存档' : '还没有存档，点下面「＋ 新建宇宙」开始吧';
    list.appendChild(empty);
    return;
  }
  const sorted = saves.slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  for (const save of sorted) {
    const isCurrent = inGame && save.id === currentSaveId;
    const item = document.createElement('div');
    item.className = 'save-item' + (isCurrent ? ' current' : '');
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = save.name;
    if (isCurrent) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '当前';
      name.appendChild(badge);
    }
    const meta = document.createElement('span');
    meta.className = 'meta';
    const bodyCount = save.state && Array.isArray(save.state.bodies) ? save.state.bodies.length : 0;
    meta.textContent = `${bodyCount} 个天体 · ${fmtTime(save.savedAt || 0)}`;
    info.appendChild(name); info.appendChild(meta);

    const acts = document.createElement('div');
    acts.className = 'acts';
    if (isCurrent) {
      const sb = document.createElement('button');
      sb.className = 'btn-save';
      sb.textContent = '💾 保存';
      sb.addEventListener('click', ev => { ev.stopPropagation(); saveCurrent(); });
      acts.appendChild(sb);
    } else {
      const lb = document.createElement('button');
      lb.className = 'btn-load';
      lb.textContent = '▶ 加载';
      lb.addEventListener('click', ev => { ev.stopPropagation(); loadSave(save.id); });
      acts.appendChild(lb);
    }
    const eb = document.createElement('button');
    eb.className = 'btn-export';
    eb.textContent = '⬇ 导出';
    eb.addEventListener('click', ev => { ev.stopPropagation(); exportSave(save.id); });
    acts.appendChild(eb);
    const db = document.createElement('button');
    db.className = 'btn-del';
    db.textContent = '✕ 删除';
    db.addEventListener('click', ev => { ev.stopPropagation(); deleteSave(save.id); });
    acts.appendChild(db);

    item.appendChild(info); item.appendChild(acts);
    list.appendChild(item);
  }
}

const typeRow = document.getElementById('typeRow');
const modeBtns = {
  star:      document.getElementById('modeStar'),
  planet:    document.getElementById('modePlanet'),
  asteroid:  document.getElementById('modeAsteroid'),
  satellite: document.getElementById('modeSatellite'),
  blackhole: document.getElementById('modeBlackhole'),
  follow:    document.getElementById('modeFollow'),
  delete:    document.getElementById('modeDelete'),
};

function updateCursor() {
  if (activePointers.size > 0) canvas.style.cursor = 'grabbing';
  else if (mode === 'delete' || mode === 'follow') canvas.style.cursor = 'pointer';
  else canvas.style.cursor = 'crosshair';
}

function buildTypeButtons() {
  typeRow.innerHTML = '';
  if (mode === 'delete') {
    const span = document.createElement('span');
    span.className = 'lbl';
    span.textContent = '点击天体即可删除';
    typeRow.appendChild(span);
    return;
  }
  if (mode === 'satellite') {
    const span = document.createElement('span');
    span.className = 'lbl';
    span.textContent = '选择类型后，点击恒星 / 行星 / 黑洞绑定';
    typeRow.appendChild(span);
  }
  if (mode === 'follow') {
    const span = document.createElement('span');
    span.className = 'lbl';
    span.textContent = '点击天体跟随视角，点空白取消';
    typeRow.appendChild(span);
    return;
  }
  const table = CATEGORIES[mode].types;
  const current = catType[mode];
  for (const [key, t] of Object.entries(table)) {
    const btn = document.createElement('button');
    btn.className = 'dot';
    btn.style.setProperty('--c', `rgb(${t.rgb.join(',')})`);
    const isWatery = !!t.water;
    /* ★ 新增：黑洞没有"含水/无水"，和恒星一样只显示名字 */
    btn.textContent = (mode === 'star' || mode === 'blackhole') ? t.name : `${t.name}·${isWatery ? '含水' : '无水'}`;
    if (key === current) btn.classList.add('active');
    (function(k){
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        catType[mode] = k;
        buildTypeButtons();
      });
    })(key);
    typeRow.appendChild(btn);
  }

function setMode(m) {
  mode = isMode(m) ? m : 'star';
  for (const k in modeBtns) {
    if (modeBtns[k]) modeBtns[k].classList.toggle('active', k === mode);

  buildTypeButtons();
  updateCursor();
}

}

/* ===================== 键盘快捷键 ===================== */
window.addEventListener('keydown', e => {
  const el = e.target;
  const tag = (el && el.tagName ? el.tagName : '').toUpperCase();
  /* ★ 修复：以前把 BUTTON 也排除在外 —— 只要点过一次面板按钮，焦点就停在
     按钮上，之后空格 / R / H / 1-6 / 方向键 全部失效。文本输入框才需要排除。 */
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
      tag === 'OPTION' || (el && el.isContentEditable)) return;
  const modalOpen = document.getElementById('saveModal').classList.contains('open');
  const isStartup = document.getElementById('saveModal').classList.contains('startup');
  if (isStartup) return;
  if (modalOpen) {
    if (e.key === 'Escape') closeSaveModal();
    return;
  }
  if (!inGame) return;
  const key = e.key;

  if (key === ' ') { e.preventDefault(); togglePause(); return; }
  if (key === 'r' || key === 'R') { resetView(); clearSelection(); return; }
  if (key === 'h' || key === 'H') {
    setHabitableZone(!showHabitableZone);
    return;
  }
  if ((key === 's' || key === 'S') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); saveCurrent(); return;
  }
  if (key === 'f' || key === 'F') { setMode('follow'); return; }
  if (key === '1') { setMode('star');      return; }
  if (key === '2') { setMode('planet');    return; }
  if (key === '3') { setMode('asteroid');  return; }
  if (key === '4') { setMode('satellite'); return; }
  if (key === '7') { setMode('blackhole'); return; }
  if (key === '5') { setMode('follow');    return; }
  if (key === '6') { setMode('delete');    return; }

  if (key === 'Delete' || key === 'Backspace') {
    if (selectedBody) { e.preventDefault(); deleteBody(selectedBody); }
    return;
  }
  if (key === 'Escape') { clearSelection(); return; }
  if (key === '=' || key === '+' || key === 'Add') { e.preventDefault(); zoomBy(1.25); return; }
  if (key === '-' || key === '_' || key === 'Subtract') { e.preventDefault(); zoomBy(1/1.25); return; }
  if (key === 'ArrowUp')    { e.preventDefault(); panByKey( 0,  1); return; }
  if (key === 'ArrowDown')  { e.preventDefault(); panByKey( 0, -1); return; }
  if (key === 'ArrowLeft')  { e.preventDefault(); panByKey(-1,  0); return; }
  if (key === 'ArrowRight') { e.preventDefault(); panByKey( 1,  0); return; }
});

/* ===================== 画布手势交互 ===================== */
const activePointers = new Map();
let panState   = null;
let pinchState = null;
let isGesturing = false;
/* 单指拖动阈值（像素）：小于它当点击，超过它才开始平移 */
const PAN_START_SLOP = 8;

function refreshGesturing() { isGesturing = activePointers.size > 0; }

/* ★ 修复：指针状态必须能被强制清空，否则一次丢失的 pointerup 会让
   isGesturing 永远为 true，相机从此不再跟随（画面像卡死） */
function clearPointerState() {
  activePointers.clear();
  panState = null;
  pinchState = null;
  refreshGesturing();
  updateCursor();
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  if (!inGame) return;
  if (e.target !== canvas) return;
  /* ★ 捕获指针：拖出窗口再松手也能收到 pointerup */
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const isPanButton = (e.button === 1 || e.button === 2);
  activePointers.set(e.pointerId, {
    id: e.pointerId, button: e.button,
    x: e.clientX, y: e.clientY,
    startX: e.clientX, startY: e.clientY,
    startTime: performance.now(),
    moved: isPanButton, isPan: isPanButton
  });
  refreshGesturing();
  updateCursor();

  /* ★ 修复：三指及以上时手势模型（1 指平移 / 2 指缩放）无法处理，
     直接清空指针状态，避免相机永久卡在"手势中"不再跟随 */
  if (activePointers.size > 2) {
    clearPointerState();
    return;
  }

  if (activePointers.size === 1) {
    const p = activePointers.get(e.pointerId);
    panState = { startCamX: camX, startCamY: camY, startScale: camScale, startX: p.startX, startY: p.startY };
    pinchState = null;
  } else if (activePointers.size === 2) {
    const [a, b] = [...activePointers.values()];
    const cx = (a.x + b.x) * 0.5;
    const cy = (a.y + b.y) * 0.5;
    pinchState = {
      startDist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      startScale: camScale,
      anchorWX: camX + (cx - W * 0.5) / camScale,
      anchorWY: camY - (cy - H * 0.5) / camScale
    };
    panState = null;
  }
});

canvas.addEventListener('pointermove', e => {
  if (!inGame) return;
  if (e.pointerType === 'mouse') { mouseX = e.clientX; mouseY = e.clientY; }
  const p = activePointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  const ddx = p.x - p.startX, ddy = p.y - p.startY;
  if (!p.moved && Math.hypot(ddx, ddy) > PAN_START_SLOP) {
    p.moved = true;
    /* ★ 修复：刚跨过拖动阈值时重设 pan 基准，否则相机会在起步瞬间跳一小下
       （旧实现直接减去已经累计的 8px 位移） */
    if (panState && !p.isPan) {
      panState.startX = p.x; panState.startY = p.y;
      panState.startCamX = camX; panState.startCamY = camY;
    }
  }

  if (activePointers.size === 1 && panState) {
    /* ★ 微动不平移，避免"点一下"时相机偏移 */
    if (!p.moved) return;
    const dx = p.x - panState.startX;
    const dy = p.y - panState.startY;
    const newCamX = panState.startCamX - dx / panState.startScale;
    const newCamY = panState.startCamY + dy / panState.startScale;
    const ref = getCameraAnchor();
    userPanX = newCamX - ref.x;
    userPanY = newCamY - ref.y;
    camX = camTarget.x = newCamX;
    camY = camTarget.y = newCamY;
  } else if (activePointers.size === 2 && pinchState) {
    const [a, b] = [...activePointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const factor = dist / pinchState.startDist;
    const rawScale = pinchState.startScale * factor;
    /* ★ 修复：用户一旦捏合缩放就交出取景控制权，否则自动取景会继续改写基准，
       把刚调好的缩放又推走（这是「视角自己动」的直接来源之一） */
    takeOverZoom();
    /* ★ 用纯函数 computeBaseScale，避免副作用 */
    const base = computeBaseScale();
    userZoom = clampUserZoom(rawScale / base);
    const actualScale = clampCamScale(base * userZoom);
    const cx = (a.x + b.x) * 0.5;
    const cy = (a.y + b.y) * 0.5;
    const newCamX = pinchState.anchorWX - (cx - W * 0.5) / actualScale;
    const newCamY = pinchState.anchorWY + (cy - H * 0.5) / actualScale;
    const ref = getCameraAnchor();
    userPanX = newCamX - ref.x;
    userPanY = newCamY - ref.y;
    camX = camTarget.x = newCamX;
    camY = camTarget.y = newCamY;
    camScale = camTarget.s = actualScale;
  }
});

function releasePointer(e, cancelled) {
  const p = activePointers.get(e.pointerId);
  if (!p) return;
  activePointers.delete(e.pointerId);
  try {
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  } catch (_) {}
  refreshGesturing();
  updateCursor();

  /* ★ 修复：pointercancel 表示手势被系统/浏览器中断，不能再当成一次点击，
     否则会在 (0,0) 附近莫名其妙丢下一个天体 */
  if (!cancelled && p && !p.moved && !p.isPan && activePointers.size === 0 &&
      performance.now() - p.startTime < 500 && inGame) {
    handleClick(e.clientX, e.clientY);
  }
  if (activePointers.size === 0) {
    panState = null; pinchState = null;
  } else if (activePointers.size === 1) {
    const rem = [...activePointers.values()][0];
    panState = { startCamX: camX, startCamY: camY, startScale: camScale, startX: rem.x, startY: rem.y };
    pinchState = null;
    rem.moved = true;
  }
}

canvas.addEventListener('pointerup', e => releasePointer(e, false));
canvas.addEventListener('pointercancel', e => releasePointer(e, true));
/* ★ 兜底：指针在画布外抬起 / 窗口失焦时也清理状态 */
window.addEventListener('pointerup', e => releasePointer(e, false));
window.addEventListener('pointercancel', e => releasePointer(e, true));
window.addEventListener('blur', clearPointerState);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearPointerState();
});

function handleClick(px, py) {
  if (mode === 'delete') {
    const target = findBodyAtScreen(px, py);
    if (target) deleteBody(target);
    return;
  }
  if (mode === 'follow') {
    const target = findBodyAtScreen(px, py);
    /* ★ 修复：跟随必须显式打开。再点同一个天体 = 取消跟随，点空白处也取消。
       以前「选中即跟随」，用户很难回到自由视角。 */
    if (target && selectedBody === target && followCam) clearSelection();
    else if (target) setFollowTarget(target);
    else clearSelection();
    return;
  }
  const wx = camX + (px - W * 0.5) / camScale;
  const wy = camY - (py - H * 0.5) / camScale;
  if (mode === 'satellite') {
    const host = findHostForSatellite(px, py);
    /* ★ 修复：找不到宿主时给个提示，不再静默失败 */
    if (!host) { showToast('请点在恒星 / 行星 / 黑洞附近再放卫星', true); return; }
    placeBody('satellite', catType.satellite, sizeMul, wx, wy, 'orbit', host);
  } else {
    placeBody(mode, catType[mode], sizeMul, wx, wy, placeMotion);
  }
  lastT = performance.now();
}

canvas.addEventListener('wheel', e => {
  if (!inGame) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const mx = e.clientX, my = e.clientY;
  const wx = camX + (mx - W * 0.5) / camScale;
  const wy = camY - (my - H * 0.5) / camScale;
  /* ★ 修复：滚轮缩放同样交出取景控制权，避免自动取景随后把缩放改写回去 */
  takeOverZoom();
  /* ★ 用纯函数 computeBaseScale，避免副作用 */
  const base = computeBaseScale();
  userZoom = clampUserZoom(userZoom * factor);
  const newScale = clampCamScale(base * userZoom);
  const newCamX = wx - (mx - W * 0.5) / newScale;
  const newCamY = wy + (my - H * 0.5) / newScale;
  const ref = getCameraAnchor();
  userPanX = newCamX - ref.x;
  userPanY = newCamY - ref.y;
  camX = camTarget.x = newCamX;
  camY = camTarget.y = newCamY;
  camScale = camTarget.s = newScale;
}, { passive: false });

canvas.addEventListener('pointerleave', e => {
  if (e.pointerType === 'mouse') { mouseX = -1; mouseY = -1; hoverBody = null; }
});

/* ===================== 世界状态重置 ===================== */
/* ★ 只重置世界/相机/模拟，不动用户当前选择的 模式 / 速度 / 大小 / 暂停 */
function resetWorldState() {
  bodies = [];
  impactEvents = [];
  clearSelection();
  hoverBody = null;
  mouseX = -1; mouseY = -1;
  simTime = 0; prevSimTime = 0;
  nextSample = SAMPLE_DT; acc = 0; E0 = 0;
  cachedMinD = Infinity;
  stepsSinceImpactCheck = 0;
  __lifeAccum = 0;
  __e0Initialized = false; __e0Pending = false; __e0DelayTimer = 0;
  __lastEnergyCalc = -1; __lastEnergyText = '—';
  camX = 0; camY = 0; camScale = 220;
  camTarget.x = 0; camTarget.y = 0; camTarget.s = 220;
  userZoom = 1; userPanX = 0; userPanY = 0;
  resetAutoFit();                 /* ★ 回到初始取景（空宇宙 → FIT_MIN_RADIUS） */
  clearPointerState();
  lastT = performance.now();
}

/* ===================== 主循环 ===================== */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (!inGame) return;

  /* ★ 修复：特效老化用的时间步 —— 有物理步进时跟随模拟时间，
     否则（暂停 / 无天体 / 该帧没有步进）退化为真实帧间隔 */
  let fxDt = 0;

  if (!paused && bodies.length) {
    acc += dt * speed;

    /* ★ 性能 / 防卡死：以前 maxStepsThisFrame 只受 MAX_STEPS=800 约束，
       速度 4× + 天体一多就是「几百步 × O(n²) 引力」，一帧要几十毫秒，
       于是下一帧 acc 更大 → 更多步 → 彻底卡死（死亡螺旋）。
       现在按「天体对数 × 步数」给每帧一个预算：天体少不受影响，
       天体多则自动减少步数（时间变慢但画面依然流畅）。 */
    const nb = bodies.length;
    const pairs = nb > 1 ? nb * (nb - 1) * 0.5 : 1;
    const stepBudget = Math.max(24, Math.floor(PHYS_PAIR_BUDGET / pairs));
    const maxStepsThisFrame = Math.min(MAX_STEPS, stepBudget, Math.ceil(acc / BASE_STEP) + 5);
    let steps = 0;
    let mergeCount = 0;

    while (acc >= BASE_STEP && steps < maxStepsThisFrame) {
      if (cachedMinD < OVERLAP_CHECK_DIST && mergeCount < 20) {
        if (checkOverlapMerge()) {
          computeAccel();
          mergeCount++;
          continue;
        }
      }
      const usedH = vvStep();
      acc -= usedH;
      simTime += usedH;
      steps++;
      /* ★ Bug 2 修复：stepsSinceImpactCheck 已移至模块级，跨帧累积 */
      stepsSinceImpactCheck++;

      /* ★ 每 10 个物理步做一次碰撞检测，防止高速小行星穿透行星 */
      if (stepsSinceImpactCheck >= 10) {
        resolveCollisions();
        stepsSinceImpactCheck = 0;
      }

      if (simTime >= nextSample) {
        sampleTrails();
        /* ★ 用 simTime 重置，避免一帧跨多个 SAMPLE_DT 时重复采样同一位置 */
        nextSample = simTime + SAMPLE_DT;
      }
    }
    /* ★ 被预算截断时直接丢掉时间债，否则 acc 会一直涨、永远被截断 */
    if (steps >= maxStepsThisFrame) acc = Math.min(acc, BASE_STEP);
    else if (acc > BASE_STEP * MAX_STEPS) acc = BASE_STEP * MAX_STEPS;

    const simDt = simTime - prevSimTime;
    prevSimTime = simTime;
    /* ★ 修复：特效改为独立于物理步老化 */
    fxDt = simDt > 0 ? simDt : dt;
    if (simDt > 0) {
      /* 生命与宜居带判定是慢变量，按 ~12Hz 节拍更新 */
      __lifeAccum += simDt;
      if (__lifeAccum >= LIFE_TICK) {
        updateLife(__lifeAccum);
        __lifeAccum = 0;
      }
    }
  } else {
    prevSimTime = simTime;
    /* ★ 修复：暂停 / 空宇宙时特效仍然按真实时间淡出，不再永久定格 */
    fxDt = dt;
  }

  ageImpactEffects(fxDt);

  /* ★ E0 延迟建立：只在"空宇宙放第一个天体"后触发 */
  if (__e0Pending) {
    __e0DelayTimer += dt;
    if (__e0DelayTimer > 0.5) {
      E0 = totalEnergy();
      __e0Initialized = true;
      __e0Pending = false;
      __lastEnergyCalc = -1;
    }
  }

  updateCamera(dt);
  render();
  __hudAccum += dt;
  if (__hudAccum > 0.15) { __hudAccum = 0; updateHUD(); }
}

/* ===================== 启动 ===================== */
resize();
setSpeed(1);
setSizeMul(1);
setMotion('orbit');
setPaused(false);
setMode('star');
loadSavesFromStorage();
openSaveModal(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
