<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>宇宙模拟器 · 沙盒</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #04050a;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block; position: fixed; inset: 0;
    z-index: 0;
    touch-action: none;
    cursor: crosshair;
  }
  .hud {
    position: fixed; left: 16px; top: 14px;
    color: #8d9aab; font: 12px/1.8 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none; text-shadow: 0 0 10px #000;
    z-index: 50;
  }
  .hud .t { color: #e8eef6; font-weight: 600; letter-spacing: .5px; }
  .hud .k { color: #4f5b6b; }
  .hud .life { color: #6ee7a0; }
  .hud .warn { color: #ffb36b; }
  .hud .follow { color: #6cd2ff; }
  .hud .save { color: #8bc4ff; }
  .panel {
    position: fixed; left: 10px; right: 10px; bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 1000;
    padding: 8px;
    background: rgba(6, 9, 14, 0.72);
    border: 1px solid #1a2332;
    border-radius: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button {
    background: #10151d;
    border: 1px solid #263040;
    color: #c3cede;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: #1a2230; border-color: #3a4a60; }
  button:active { background: #1c3554; }
  button.active { background: #1c3554; border-color: #3f7fd0; color: #d7e8ff; }
  button.danger.active { background: #4a1c1c; border-color: #d05555; color: #ffd7d7; }
  button.bio.active { background: #14381f; border-color: #4dbf72; color: #d6ffe3; }
  button.follow.active { background: #143349; border-color: #4db7f0; color: #d6f0ff; }
  button.save-btn { background: #14381f; border-color: #2f6d40; color: #c8f4d8; }
  button.save-btn:hover { background: #1a4a28; border-color: #4dbf72; }
  button.dot::before {
    content: ''; display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
    background: var(--c, #888); box-shadow: 0 0 8px var(--c, #888);
  }
  .lbl {
    color: #6b7789; font: 11px ui-monospace, Menlo, Consolas, monospace;
    display: flex; align-items: center; gap: 5px;
  }
  input[type=range] { width: 80px; accent-color: #4d8fe8; }
  .sep { width: 1px; height: 18px; background: #263040; margin: 0 2px; }
  .tip {
    position: fixed; right: 12px; top: 56px; text-align: right;
    color: #4f5b6b; font: 11px/1.7 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 8px #000;
  }
  .tip b { color: #7a88a0; font-weight: 600; }
  .save-btn-fixed {
    position: fixed;
    right: 12px; top: 12px;
    z-index: 100;
    padding: 8px 14px;
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    display: none;
  }
  body.in-game .save-btn-fixed { display: block; }
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 5000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal.startup {
    background: #04050a;
    padding: 0;
    align-items: stretch;
    justify-content: stretch;
  }
  .modal-content {
    background: #0a1018;
    border: 1px solid #1f2a3b;
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7);
    color: #c3cede;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  .modal.startup .modal-content {
    max-width: 100%;
    max-height: 100%;
    border-radius: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    height: 100%;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #1a2332;
    font-size: 14px;
    color: #e8eef6;
    font-weight: 600;
  }
  .modal.startup .modal-head {
    padding: 24px 24px 12px;
    border-bottom: none;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .modal-head .subtitle {
    display: block;
    font-size: 11px;
    color: #4f5b6b;
    font-weight: 400;
    letter-spacing: 0;
    margin-top: 4px;
  }
  .modal-head button {
    padding: 4px 10px;
    font-size: 14px;
    line-height: 1;
  }
  .modal.startup .modal-head button { display: none; }
  .save-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 80px;
    max-height: 50vh;
  }
  .modal.startup .save-list {
    max-height: none;
    padding: 12px 24px 24px;
    align-items: center;
  }
  .modal.startup .save-list > * {
    width: 100%;
    max-width: 480px;
  }
  .save-empty {
    color: #4f5b6b;
    text-align: center;
    padding: 30px 10px;
    font-style: italic;
  }
  .save-item {
    background: #10151d;
    border: 1px solid #1a2332;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .save-item.current {
    border-color: #2f6d40;
    background: #0d1a12;
  }
  .save-item .info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .save-item .name {
    color: #e8eef6;
    font-weight: 600;
    font-size: 13px;
    word-break: break-all;
  }
  .save-item.current .name { color: #c8f4d8; }
  .save-item .meta {
    color: #4f5b6b;
    font-size: 10px;
    white-space: nowrap;
  }
  .save-item .badge {
    display: inline-block;
    background: #2f6d40;
    color: #d4ffe0;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: .5px;
  }
  .save-item .acts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .save-item .acts button {
    padding: 6px 10px;
    font-size: 11px;
  }
  .btn-load    { background: #14381f; border-color: #2f6d40; color: #c8f4d8; }
  .btn-load:hover { background: #1a4a28; border-color: #4dbf72; }
  .btn-export  { background: #14283a; border-color: #2c5a80; color: #c7e3ff; }
  .btn-export:hover { background: #1c3a52; border-color: #3f7fb0; }
  .btn-del     { background: #2a1212; border-color: #6d2f2f; color: #ffd7d7; }
  .btn-del:hover { background: #3a1a1a; border-color: #d05555; }
  .btn-save    { background: #1a3a28; border-color: #2f6d40; color: #c8f4d8; }
  .btn-save:hover { background: #245038; border-color: #4dbf72; }
  .modal-actions {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #1a2332;
    flex-wrap: wrap;
  }
  .modal.startup .modal-actions {
    border-top: none;
    justify-content: center;
    padding: 0 24px 32px;
  }
  .modal-actions button {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
  }
  .modal.startup .modal-actions button {
    flex: 0 1 200px;
  }
  .toast {
    position: fixed;
    left: 50%; bottom: 120px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 40, 60, 0.95);
    border: 1px solid #2c5a80;
    color: #c7e3ff;
    padding: 10px 18px;
    border-radius: 10px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    z-index: 6000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error {
    background: rgba(60, 20, 20, 0.95);
    border-color: #7a2a2a;
    color: #ffd7d7;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>

<button class="save-btn-fixed save-btn" id="btnOpenSave">💾 存档管理</button>

<div class="panel">
  <div class="row">
    <span class="lbl">模式</span>
    <button id="modeStar" class="active" title="快捷键 1">✦ 恒星</button>
    <button id="modePlanet" title="快捷键 2">● 行星</button>
    <button id="modeAsteroid" title="快捷键 3">· 小行星</button>
    <button id="modeSatellite" title="快捷键 4">◦ 卫星</button>
    <button id="modeBlackhole" class="danger" title="快捷键 7">◎ 黑洞</button>
    <button id="modeFollow" class="follow" title="快捷键 5">◎ 跟随</button>
    <button id="modeDelete" class="danger" title="快捷键 6">✕ 删除</button>
  </div>

  <div class="row">
    <span class="lbl">类型</span>
    <div id="typeRow" class="row"></div>
  </div>

  <div class="row">
    <span class="lbl">初速</span>
    <button id="motOrbit" class="active">轨道</button>
    <button id="motStatic">静止</button>
    <span class="sep"></span>
    <label class="lbl">大小 <input id="size" type="range" min="0.5" max="2.5" step="0.1" value="1"></label>
    <span class="lbl" id="sizeVal">1.0×</span>
  </div>

  <div class="row">
    <label class="lbl">速度 <input id="speed" type="range" min="0" max="1000" step="1" value="399"></label>
    <span class="lbl" id="speedVal">1.0×</span>
    <span class="sep"></span>
    <button id="btnSaveQuick" class="save-btn">💾 保存</button>
    <button id="btnHabitable" class="bio" title="快捷键 H">◎ 宜居带</button>
    <button id="btnPause" title="空格">暂停</button>
    <button id="btnResetView" title="快捷键 R">重置视角</button>
    <button id="btnClear" class="danger">全部清空</button>
    <button id="btnExit" class="danger">⏏ 退出</button>
  </div>
</div>

<div class="tip">
  <b>触屏</b> 单指滑动 · 双指捏合 · 轻点放置<br>
  <b>电脑</b> 右键拖拽平移 · 滚轮缩放 · 左键放置<br>
  <b>键盘</b> 空格暂停 · R重置 · H宜居带 · 1-7模式<br>
  <b>键盘</b> F跟随 · Del删除选中 · Esc取消 · 方向键平移
</div>

<div class="modal" id="saveModal">
  <div class="modal-content">
    <div class="modal-head">
      <div id="modalTitle">
        <span id="modalHeading">选择存档</span>
        <span class="subtitle" id="modalSubtitle">加载一个已有的宇宙，或新建一个</span>
      </div>
      <button id="modalClose">✕</button>
    </div>
    <div class="save-list" id="saveList"></div>
    <div class="modal-actions">
      <button id="btnNewSave" class="btn-load">＋ 新建宇宙</button>
      <button id="btnImportSave" class="btn-export">⬆ 导入存档</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================================
   宇宙模拟器 —— 恒星 / 行星 / 小行星 / 卫星 沙盒
   · 启动时进入存档页
   · 天体合并：动量守恒 + 位置取质心
   · 相机：自动取景带滞回死区 + 对数平滑；手动缩放过就冻结取景（按 R 恢复）
   · 跟随视角、卫星绑定、生命系统、存档系统
   ============================================================= */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let stars = [];
/* ★ 性能：星星按亮度分桶，渲染时每桶只发一次 fill（原来是一颗一颗 fillRect + 改 alpha） */
const STAR_BUCKETS = 6;
let starBuckets = [];

let __lastResizeW = 0, __lastResizeH = 0, __lastDPR = 0;
function resize() {
  /* ★ 性能：DPR 上限从 2 降到 1.5。
     手机上 DPR=2 时 1080×2400 的屏会变成 2160×4800 ≈ 1000 万像素，
     每帧一次全屏 fillRect + 合成，是中低端机上最大的一笔固定开销。 */
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const newW = window.innerWidth, newH = window.innerHeight;
  /* ★ 修复：DPR 变化（浏览器缩放 / 跨屏拖动）也必须重建画布，否则画面会糊或错位 */
  if (newW === __lastResizeW && newH === __lastResizeH && dpr === __lastDPR && W > 0) return;
  __lastResizeW = newW; __lastResizeH = newH; __lastDPR = dpr;
  DPR = dpr;
  W = newW; H = newH;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  stars = [];
  const n = Math.round(W * H / 8000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.3 + 0.25,
      a: Math.random() * 0.55 + 0.12
    });
  }
  starBuckets = [];
  for (let k = 0; k < STAR_BUCKETS; k++) starBuckets.push([]);
  for (const s of stars) {
    const k = Math.min(STAR_BUCKETS - 1, Math.max(0, Math.floor(s.a / 0.67 * STAR_BUCKETS)));
    starBuckets[k].push(s);
  }
}
let __resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(resize, 150);
});
window.addEventListener('orientationchange', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(resize, 250);
});

/* ===================== 物理常量 ===================== */
const G         = 1;
const BASE_STEP = 0.0004;
const SOFTENING = 0.06;
/* ★ 32× 需要 ceil(32×0.0167/0.0004) ≈ 1335 步/帧，所以上限从 800 提到 2400。
   真正的性能保护仍是 PHYS_PAIR_BUDGET（天体越多，每帧步数自动越少），
   抬高 MAX_STEPS 只是让"天体很少 + 高倍速"时能真的跑满 32×。 */
const MAX_STEPS = 2400;
const OVERLAP_CHECK_DIST = 0.15;
const SAMPLE_DT = 0.02;
const MAX_TRAIL = 1200;
const TRAIL_TRIM = 400;        /* ★ 性能：轨迹超限时一次裁掉一整块，而不是每次采样都 splice */
/* ★ 修复：轨迹分块屏幕剔除的边距（像素） */
const TRAIL_CULL = 64;
const CHUNK     = 16;
const TWO_PI    = Math.PI * 2;
const SOFTENING2 = SOFTENING * SOFTENING;
const PHYS_PAIR_BUDGET = 8e5;  /* ★ 性能：每帧「天体对数 × 物理步数」预算 */
const LIFE_TICK = 0.08;        /* ★ 性能：生命/宜居带演化按 ~12Hz 更新即可 */

const SATELLITE_SPEED_MUL = 12;
const IMPACT_BASE_R     = 0.28;
const IMPACT_R_PER_SIZE = 0.14;
const SAT_INTERCEPT_PER = 0.35;
const SAT_INTERCEPT_MAX = 0.75;

const SIZE_FROM_MASS_EXP = 1 / 2.5;

const MIN_ZOOM = 0.05;
const MAX_ZOOM = 60;
/* ★ 修复：视角缩放全局上限。camScale = 基准（computeBaseScale）× userZoom，
   基准在 fitRadius 极小时会爆掉，必须兜底，否则轨迹/圆弧会生成
   上百万像素的几何，把低端机直接拖死。 */
const MAX_CAM_SCALE = 20000;
/* ★ 修复：存档反序列化的物理量绝对值上限，防止损坏/恶意存档把模拟打成 Infinity / NaN */
const MAX_SAVE_MASS  = 1e6;
const MAX_SAVE_POS   = 1e4;
const MAX_SAVE_SPEED = 1e3;

/* ===================== 天体类型表 ===================== */
const STAR_TYPES = {
  m: { name: '红矮星', mass: 0.35, rMul: 0.78, rgb: [255, 138, 105] },
  k: { name: '橙矮星', mass: 0.70, rMul: 0.90, rgb: [255, 182, 120] },
  g: { name: '类太阳', mass: 1.00, rMul: 1.00, rgb: [255, 202,  92] },
  o: { name: '蓝巨星', mass: 3.20, rMul: 1.55, rgb: [150, 200, 255] },
  r: { name: '红巨星', mass: 1.40, rMul: 2.10, rgb: [255, 110,  80] },
  w: { name: '白矮星', mass: 0.85, rMul: 0.42, rgb: [218, 236, 255] },
};

const PLANET_TYPES = {
  rock:   { name: '岩质行星',   mass: 2.5e-4, water: false, rgb: [186, 168, 148] },
  desert: { name: '沙漠行星',   mass: 3.0e-4, water: false, rgb: [224, 176, 108] },
  gas:    { name: '气态巨行星', mass: 1.8e-3, water: false, rgb: [232, 190, 140] },
  terra:  { name: '类地行星',   mass: 4.0e-4, water: true,  rgb: [ 96, 170, 255] },
  ocean:  { name: '海洋行星',   mass: 5.0e-4, water: true,  rgb: [ 62, 124, 224] },
  ice:    { name: '冰封行星',   mass: 3.5e-4, water: true,  rgb: [178, 222, 255] },
};

const ASTEROID_TYPES = {
  stony: { name: '石质小行星', mass: 2.0e-6, water: false, rgb: [172, 156, 140] },
  icy:   { name: '冰质小行星', mass: 3.0e-6, water: true,  rgb: [176, 212, 238] },
};

const SATELLITE_TYPES = {
  rocky: { name: '岩石卫星', mass: 4.0e-6, water: false, rgb: [196, 196, 202] },
  icy:   { name: '冰质卫星', mass: 5.5e-6, water: true,  rgb: [190, 222, 250] },
};

/* ★ 新增：黑洞分类。质量极高、颜色极暗（深紫），半径系数很小
   —— 它是「演化终点」，只吸积、不再改变类型。 */
const BLACKHOLE_TYPES = {
  blackhole: { name: '黑洞', mass: 15.0, water: false, rgb: [ 40, 10, 60 ], rMul: 0.6 },
};

const CATEGORIES = {
  star:      { label: '恒星',   types: STAR_TYPES },
  planet:    { label: '行星',   types: PLANET_TYPES },
  asteroid:  { label: '小行星', types: ASTEROID_TYPES },
  satellite: { label: '卫星',   types: SATELLITE_TYPES },
  blackhole: { label: '黑洞',   types: BLACKHOLE_TYPES },
};

/* ===================== 天体演化（迭代）系统 · 常量 =====================
   ★ 设计约束：本系统只改变「天体自身的类型 / 外观 / 质量归属 / 卫星归属」，
     绝不修改引力公式（computeAccel）与动量守恒（合并、吞噬全按动量加权）。
   ★ 触发时机：只在「发生合并」之后检查一次（checkOverlapMerge / resolveCollisions）。
   ★ 演化是单向的：只会往更重的阶段走，不会降级，所以单遍扫描即可收敛。 */
const EVOLVE_PLANET_TO_STAR = 1.5;      /* 行星质量 > 1.5 → 点燃成红矮星 */
const EVOLVE_WHITE_DWARF_TO_BH = 20.0;  /* 白矮星质量 > 20 → 坍缩成黑洞 */
const EVOLVE_FX_LIFE = 2.6;             /* 演化爆炸特效时长（秒）；普通撞击为 1.2 */
const EVOLVE_FX_SCALE = 2.6;            /* 演化爆炸特效尺寸倍率 */
const BLACKHOLE_SCORCH_RADIUS = 1.0;    /* 黑洞灼烧半径：此范围内的行星判定为 tooHot */

/* 恒星演化阶梯：顺序与需求一致（红矮星 → 橙矮星 → 类太阳 → 蓝巨星 → 红巨星 → 白矮星）
   每一档的 minMass 是「达到该档所需的最低质量」，数值可按手感自由调整。 */
const STAR_EVOLUTION_CHAIN = [
  { key: 'm', minMass: 0    },  /* 红矮星   —— 恒星起点 */
  { key: 'k', minMass: 3.0  },  /* 橙矮星   */
  { key: 'g', minMass: 6.0  },  /* 类太阳   */
  { key: 'o', minMass: 10.0 },  /* 蓝巨星   */
  { key: 'r', minMass: 14.0 },  /* 红巨星   */
  { key: 'w', minMass: 18.0 },  /* 白矮星   —— 再突破 20.0 即坍缩成黑洞 */
];

const CATEGORY_KEYS = Object.keys(CATEGORIES);
const MODE_KEYS = ['star', 'planet', 'asteroid', 'satellite', 'blackhole', 'follow', 'delete'];
function isCategory(v) { return typeof v === 'string' && Object.prototype.hasOwnProperty.call(CATEGORIES, v); }
function isMode(v) { return MODE_KEYS.indexOf(v) >= 0; }

/* ===================== 全局状态 ===================== */
let bodies = [];
let simTime = 0;
let prevSimTime = 0;
let nextSample = 0;
let acc = 0;
let paused = false;
let speed = 1;
let E0 = 0;

let camX = 0, camY = 0, camScale = 220;
const camTarget = { x: 0, y: 0, s: 220 };

let userZoom  = 1;
let userPanX  = 0;
let userPanY  = 0;

/* ---- 自动取景（auto-fit）参数与状态 ----
   ★ 修复：旧实现只有一个 smoothMaxD，「变大立刻赋值、变小每帧 ×0.998」，
     于是画面会出现两种「自己动」：
       1) 任何一次瞬间外扩（甩出去的小行星、双星椭圆轨道的远心点）都把画面猛地推远，
          之后要五六秒才慢慢缩回 —— 每一个轨道周期都重演一遍；
       2) 最终缩放 = 基准 × userZoom，而基准一直在变，
          等于用户捏合出来的缩放被自动取景反复改写。
     现在改成：滞回死区（±25% 内完全不动）+ 对数空间平滑 + 手动缩放后冻结取景。 */
const FIT_MIN_RADIUS  = 0.6;    /* 取景半径下限，同时避免除零 */
const FIT_GROW_BAND   = 1.25;   /* 超过目标 25% 才扩张：吃掉周期性抖动 */
const FIT_SHRINK_BAND = 0.75;   /* 小于目标 75% 才收缩 */
const FIT_TAU_OUT     = 0.50;   /* 扩张时间常数（秒） */
const FIT_TAU_IN      = 0.90;   /* 收缩更慢，避免「一清空就猛拉近」 */
const VIEW_FILL_FRAC  = 0.36;   /* 取景半径占屏幕短边的比例 */
const FIT_EMPTY_SCALE = 220;    /* 空宇宙的固定基准缩放 */

let fitRadius = FIT_MIN_RADIUS;  /* 当前平滑后的取景半径（世界单位） */
let fitTarget = FIT_MIN_RADIUS;  /* 带滞回的取景目标 */
let autoFit   = true;            /* 用户手动缩放过 → false，画面不再自己缩放 */

let mode = 'star';
let catType = { star: 'g', planet: 'terra', asteroid: 'stony', satellite: 'rocky', blackhole: 'blackhole' };
let placeMotion = 'orbit';
let sizeMul = 1;

let mouseX = -1, mouseY = -1;
let hoverBody = null;

let showHabitableZone = false;
let selectedBody = null;
/* ★ 新增：相机是否锁定跟随 selectedBody。
   以前只要「有选中」就跟随，而选中状态会被存档恢复 —— 读一次档，
   视角就自己飘到某颗天体上并一直跟着它动，用户完全不知道发生了什么。
   现在跟随必须显式打开（跟随模式点天体 / 按 F），并随存档保存。 */
let followCam = false;
let impactEvents = [];

function clearSelection() { selectedBody = null; followCam = false; }
function setFollowTarget(b) { selectedBody = b || null; followCam = !!b; }

let inGame = false;
let currentSaveId = null;

let lastT = performance.now();

/* ★ Bug 2 修复：将碰撞检测计数器移到模块级，跨帧累积 */
let stepsSinceImpactCheck = 0;

/* ★ 性能：生命/宜居带节拍累加器（见 updateLife 与主循环） */
let __lifeAccum = 0;

/* ★ E0 延迟建立（避免初始瞬态污染基准）
   ★ 只在两种时机触发：
     1) 空宇宙里放下第一个天体
     2) 加载存档后立即锁定（不走延迟）
   其他所有操作（继续放置、删除、合并）都不重建 E0。 */
let __e0Initialized = false;
let __e0Pending = false;
let __e0DelayTimer = 0;
function markE0Dirty() {
  __e0Pending = true;
  __e0DelayTimer = 0;
}

/* ===================== 工具 ===================== */
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    c === '&' ? '&amp;' :
    c === '<' ? '&lt;' :
    c === '>' ? '&gt;' :
    c === '"' ? '&quot;' : '&#39;'
  ));
}

function clampNum(v, lo, hi) {
  const n = (typeof v === 'number') ? v : parseFloat(v);
  if (!Number.isFinite(n)) return lo;
  return Math.min(hi, Math.max(lo, n));
}

/* ★ 修复：绝对值上限（存档反序列化用），非有限值退回 0 */
function clampAbs(v, lim) {
  const n = (typeof v === 'number') ? v : parseFloat(v);
  if (!Number.isFinite(n)) return 0;
  return Math.max(-lim, Math.min(lim, n));
}

function numOr(v, fallback) {
  const n = (typeof v === 'number') ? v : parseFloat(v);
  return Number.isFinite(n) ? n : fallback;
}

function getCentroid() {
  let M = 0, cx = 0, cy = 0;
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    M += b.m; cx += b.m * b.x; cy += b.m * b.y;
  }
  if (M > 0) { cx /= M; cy /= M; }
  return { x: cx, y: cy, M };
}

/* 相机当前锚点：跟随时是被跟随的天体，否则是系统质心（总动量守恒 → 质心几乎不动）。
   ★ 修复：以前 getRefPoint 只要「有选中」就返回选中天体，可它同时还被
     缩放 / 平移的手势代码用来换算 userPan —— 与 updateCamera 的判定不一致时，
     一次读档就会让锚点、pan 偏移、跟随三者对不上，画面自己飘。现在只有一份判定。 */
function getCameraAnchor() {
  if (followCam && selectedBody && bodies.indexOf(selectedBody) >= 0) {
    return { x: selectedBody.x, y: selectedBody.y };
  }
  if (!bodies.length) return { x: 0, y: 0 };
  const c = getCentroid();
  return { x: c.x || 0, y: c.y || 0 };
}

function sizeFromMass(kind, typeKey, mass) {
  const table = CATEGORIES[kind] && CATEGORIES[kind].types;
  const baseMass = (table && table[typeKey] && table[typeKey].mass) || 1;
  return Math.pow(Math.max(mass, 1e-12) / baseMass, SIZE_FROM_MASS_EXP);
}

/* ===================== 宜居带 ===================== */
function starLuminosity(star) {
  return Math.pow(Math.max(star.m, 0.05), 3.0);
}

function habitableZone(star) {
  const L = starLuminosity(star);
  const rIn  = 0.85 * Math.sqrt(L);
  const rOut = 1.85 * Math.sqrt(L);
  return { rIn, rOut, L };
}

function getHabitabilityInfo(body) {
  /* ★ 新增：黑洞自身永远"过热"，没有任何宜居可能 */
  if (body && body.kind === 'blackhole') {
    return { inHZ: false, tooHot: true, tooCold: false, star: null, dist: 0, hz: null };
  }
  let closestStar = null;
  let closestDist = Infinity;
  let closestHZ = null;
  for (const s of bodies) {
    if (s.kind !== 'star') continue;
    const d = Math.hypot(body.x - s.x, body.y - s.y);
    if (d < closestDist) {
      closestDist = d;
      closestStar = s;
      closestHZ = habitableZone(s);
    }
  }
  if (!closestStar) {
    return { inHZ: false, tooHot: false, tooCold: true, star: null, dist: 0, hz: null };
  }
  const tooHot  = closestDist < closestHZ.rIn * 0.75;
  const tooCold = closestDist > closestHZ.rOut * 1.5;
  const inHZ    = closestDist >= closestHZ.rIn && closestDist <= closestHZ.rOut;
  return { inHZ, tooHot, tooCold, star: closestStar, dist: closestDist, hz: closestHZ };
}

function isInHabitableZoneSimple(body) {
  return getHabitabilityInfo(body).inHZ;
}

/* ★ 新增：黑洞灼烧判定 —— 行星一旦落在黑洞的灼烧半径内（或本身是黑洞），
   就按 tooHot 处理，直接抹杀生命。 */
function isScorchedByBlackHole(body) {
  if (!body) return false;
  if (body.kind === 'blackhole') return true;
  for (const s of bodies) {
    if (s.kind !== 'blackhole') continue;
    const d = Math.hypot(body.x - s.x, body.y - s.y);
    if (d < BLACKHOLE_SCORCH_RADIUS + collisionRadius(s)) return true;
  }
  return false;
}

/* ===================== 创建天体 ===================== */
function createBody(kind, typeKey, sizeMulVal, x, y) {
  const t = CATEGORIES[kind].types[typeKey];
  const mass = t.mass * Math.pow(sizeMulVal, 2.5);
  return {
    kind, typeKey, name: t.name, m: mass,
    x, y, vx: 0, vy: 0, ax: 0, ay: 0,
    sizeMul: sizeMulVal, rMul: t.rMul || 1,
    water: !!t.water, rgb: t.rgb.slice(), trail: [x, y],
    host: null, orbitRadius: 0, orbitPhase: 0, orbitAngularSpeed: 0,
    life: 0, lifeStage: 'barren', gestationTimer: 0,
    flash: 0, flashColor: null,
  };
}
/* ===================== 天体演化（迭代）系统 · 核心逻辑 ===================== */
function starChainIndex(typeKey) {
  for (let i = 0; i < STAR_EVOLUTION_CHAIN.length; i++) {
    if (STAR_EVOLUTION_CHAIN[i].key === typeKey) return i;
  }
  return -1;
}

/* 给定质量，返回对应的恒星档位（取不超过该质量的最高一档） */
function starKeyForMass(mass) {
  let key = STAR_EVOLUTION_CHAIN[0].key;
  for (const stage of STAR_EVOLUTION_CHAIN) {
    if (mass >= stage.minMass) key = stage.key;
  }
  return key;
}

/* 计算「应该演化成什么」：返回 { kind, key } 或 null（不需要演化） */
function evolutionTarget(b) {
  if (!b) return null;
  /* 黑洞是演化终点：只吸积质量，永远不再改变类型 */
  if (b.kind === 'blackhole') return null;

  if (b.kind === 'planet') {
    /* 规则 1：行星质量 > 1.5 → 立刻点燃成恒星（最基础的红矮星起步，再按质量直接对上档位） */
    if (!(b.m > EVOLVE_PLANET_TO_STAR)) return null;
    const key = starKeyForMass(b.m);
    /* 极端情况：一颗超重行星直接越过白矮星上限，于是当场坍缩成黑洞 */
    if (key === 'w' && b.m > EVOLVE_WHITE_DWARF_TO_BH) return { kind: 'blackhole', key: 'blackhole' };
    return { kind: 'star', key };
  }

  if (b.kind === 'star') {
    const cur = starChainIndex(b.typeKey);
    if (cur < 0) return null;
    /* 规则 3：白矮星质量进一步突破上限 → 立刻坍缩成黑洞 */
    if (cur === STAR_EVOLUTION_CHAIN.length - 1 && b.m > EVOLVE_WHITE_DWARF_TO_BH) {
      return { kind: 'blackhole', key: 'blackhole' };
    }
    /* 规则 2：恒星按质量逐级升级（只升不降，所以用索引比较） */
    const key = starKeyForMass(b.m);
    const tgt = starChainIndex(key);
    if (tgt <= cur) return null;
    if (key === 'w' && b.m > EVOLVE_WHITE_DWARF_TO_BH) return { kind: 'blackhole', key: 'blackhole' };
    return { kind: 'star', key };
  }
  return null;
}

/* 执行一次演化：重塑类型与外观、处理卫星、播放大爆炸特效 */
function evolveBody(b) {
  const target = evolutionTarget(b);
  if (!target) return false;
  const table = CATEGORIES[target.kind] && CATEGORIES[target.kind].types;
  const t = table && table[target.key];
  if (!t) return false;

  const oldKind = b.kind;
  const oldName = b.name;
  const becameBlackHole = (target.kind === 'blackhole');

  /* ---------- 1. 卫星处理 ---------- */
  if (becameBlackHole) {
    /* 恒星 → 黑洞：周围卫星被直接吞噬。质量并入黑洞，速度按动量加权（守恒） */
    const eaten = bodies.filter(s => s.kind === 'satellite' && s.host === b);
    if (eaten.length) {
      let mt = b.m;
      let pvx = b.m * b.vx;
      let pvy = b.m * b.vy;
      for (const s of eaten) {
        mt += s.m;
        pvx += s.m * s.vx;
        pvy += s.m * s.vy;
      }
      if (mt > 0) { b.vx = pvx / mt; b.vy = pvy / mt; b.m = mt; }
      bodies = bodies.filter(s => eaten.indexOf(s) < 0);
      for (const s of eaten) {
        impactEvents.push({ x: s.x, y: s.y, t: 0, type: 'shield' });
        if (selectedBody === s) selectedBody = b;
      }
    }
  } else if (oldKind === 'planet' && target.kind === 'star') {
    /* 行星 → 恒星：卫星解绑，并在原地变成一颗独立的小行星（绝不凭空消失）
       ★ 位置与速度都不动：它带着自己的轨道速度继续自由飞行 */
    for (const s of bodies) {
      if (s.kind !== 'satellite' || s.host !== b) continue;
      s.host = null;
      s.orbitRadius = 0;
      s.orbitPhase = 0;
      s.orbitAngularSpeed = 0;
      s.kind = 'asteroid';
      s.typeKey = 'stony';
      const at = CATEGORIES.asteroid.types.stony;
      s.name = at.name;
      s.water = !!at.water;
      s.rgb = at.rgb.slice();
      s.rMul = at.rMul || 1;
      s.sizeMul = clampNum(sizeFromMass('asteroid', 'stony', s.m), 0.5, 4.0);
      s.trail = [s.x, s.y];
      s.life = 0; s.lifeStage = 'barren'; s.gestationTimer = 0;
    }
  }

  /* ---------- 2. 属性同步（类型 / 名字 / 大小 / 颜色 / 含水） ---------- */
  b.kind = target.kind;
  b.typeKey = target.key;
  b.name = t.name;
  b.rMul = t.rMul || 1;
  b.rgb = t.rgb.slice();
  b.water = !!t.water;
  b.sizeMul = clampNum(sizeFromMass(target.kind, target.key, b.m), 0.5, 4.0);
  /* 演化后的天体生命清零，从"荒芜"重新开始（黑洞永远不会再孕育生命） */
  b.life = 0;
  b.lifeStage = 'barren';
  b.gestationTimer = 0;
  b.flash = 1.0;
  b.flashColor = t.rgb.slice();
  /* 轨迹从当前位置重新起算，避免旧身份的轨迹线残留在画面上 */
  b.trail = [b.x, b.y];

  /* ---------- 3. 极其巨大的爆炸特效（复用 impactEvents，时长/尺寸都更大） ---------- */
  impactEvents.push({
    x: b.x, y: b.y, t: 0,
    type: 'evolution', life: EVOLVE_FX_LIFE, scale: EVOLVE_FX_SCALE
  });

  /* 质量与宿主变了，加速度缓存必须重算（引力公式本身一行未改） */
  computeAccel();

  showToast(`${oldName} 演化为 ${t.name}`);
  return true;
}

/* 合并之后统一跑一遍：任何越过阈值的天体都会立刻演化 */
function runEvolutionPass() {
  if (!bodies.length) return false;
  let changed = false;
  /* 用快照遍历：evolveBody 可能吞噬卫星 / 改写 bodies 数组 */
  const snapshot = bodies.slice();
  for (const b of snapshot) {
    if (bodies.indexOf(b) < 0) continue;   /* 已被黑洞吞掉 */
    if (evolveBody(b)) changed = true;
  }
  return changed;
}

/* ===================== 物理积分 ===================== */
let cachedMinD = Infinity;
function computeAccel() {
  const n = bodies.length;
  const bs = bodies;
  let minD2 = Infinity;
  for (let i = 0; i < n; i++) { bs[i].ax = 0; bs[i].ay = 0; }
  for (let i = 0; i < n; i++) {
    const bi = bs[i];
    if (bi.kind === 'satellite') continue;
    /* ★ 性能：把 bi 的加速度累加在局部变量里，内层循环只做算术，
       避免每对天体 6 次对象属性读写（这是 O(n²) 热点，实测最见效的一处） */
    const xi = bi.x, yi = bi.y, mi = bi.m;
    /* 注意：必须从当前值起累加 —— 前面的外层循环作为 bj 已经给 bi 写入了加速度 */
    let axi = bi.ax, ayi = bi.ay;
    for (let j = i + 1; j < n; j++) {
      const bj = bs[j];
      if (bj.kind === 'satellite') continue;
      const dx = bj.x - xi;
      const dy = bj.y - yi;
      const d2 = dx * dx + dy * dy;
      if (d2 < minD2) minD2 = d2;
      const d2s = d2 + SOFTENING2;
      const inv = 1 / (d2s * Math.sqrt(d2s));
      const f = G * inv;
      axi += f * bj.m * dx;  ayi += f * bj.m * dy;
      const fj = f * mi;
      bj.ax -= fj * dx;      bj.ay -= fj * dy;
    }
    bi.ax = axi; bi.ay = ayi;
  }
  cachedMinD = minD2 === Infinity ? 1 : Math.sqrt(minD2);
}

/* ★ 固定步长。近距接近时由 checkOverlapMerge 提前合并。 */
function vvStep() {
  const h = BASE_STEP;

  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    b.x += b.vx * h + 0.5 * b.ax * h * h;
    b.y += b.vy * h + 0.5 * b.ay * h * h;
    b.vx += 0.5 * b.ax * h;
    b.vy += 0.5 * b.ay * h;
  }
  computeAccel();
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;
    b.vx += 0.5 * b.ax * h;
    b.vy += 0.5 * b.ay * h;
  }

  for (const b of bodies) {
    if (b.kind !== 'satellite' || !b.host) continue;
    b.orbitPhase += b.orbitAngularSpeed * h;
    b.x = b.host.x + Math.cos(b.orbitPhase) * b.orbitRadius;
    b.y = b.host.y + Math.sin(b.orbitPhase) * b.orbitRadius;
    const tang = b.orbitRadius * b.orbitAngularSpeed;
    b.vx = b.host.vx - Math.sin(b.orbitPhase) * tang;
    b.vy = b.host.vy + Math.cos(b.orbitPhase) * tang;
  }
  return h;
}

/* ★ 提前合并 —— 当两个天体已经重叠时立即合并 */
function checkOverlapMerge() {
  const toRemove = new Set();
  const events = [];
  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (toRemove.has(bi) || bi.kind === 'satellite') continue;
    for (let j = i + 1; j < bodies.length; j++) {
      /* ★ 修复：bi 可能在本轮内已经被合并掉（它变成了 small），
         必须立刻停止用它继续合并，否则后面的天体会被合进一个即将被删除的
         天体里 —— 两个天体一起消失，质量凭空蒸发 */
      if (toRemove.has(bi)) break;
      const bj = bodies[j];
      if (toRemove.has(bj) || bj.kind === 'satellite') continue;

      /* ★ 跳过"行星-小行星"对，交给 resolveCollisions（含卫星拦截） */
      const isAstPla =
        (bi.kind === 'asteroid' && bj.kind === 'planet') ||
        (bi.kind === 'planet' && bj.kind === 'asteroid');
      if (isAstPla) continue;

      const d = Math.hypot(bj.x - bi.x, bj.y - bi.y);
      if (d < collisionRadius(bi) + collisionRadius(bj)) {
        const big   = bi.m >= bj.m ? bi : bj;
        const small = bi.m >= bj.m ? bj : bi;

        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === small && !toRemove.has(s)) {
            s.host = big;
            const ddx = s.x - big.x, ddy = s.y - big.y;
            s.orbitRadius = Math.max(0.15, Math.hypot(ddx, ddy));
            s.orbitPhase = Math.atan2(ddy, ddx);
            const vPhys = Math.sqrt(G * Math.max(big.m, 1e-9) / s.orbitRadius);
            s.orbitAngularSpeed = (vPhys / s.orbitRadius) * SATELLITE_SPEED_MUL;
          }
        }
        if (small.kind === 'planet' && (small.lifeStage === 'alive' || small.life > 0)) {
          killLife(small, [255, 100, 60]);
        }
        const mergedM = big.m + small.m;
        big.vx = (big.m * big.vx + small.m * small.vx) / mergedM;
        big.vy = (big.m * big.vy + small.m * small.vy) / mergedM;
        big.x  = (big.m * big.x  + small.m * small.x)  / mergedM;
        big.y  = (big.m * big.y  + small.m * small.y)  / mergedM;
        big.m  = mergedM;
        big.sizeMul = Math.min(4.0, sizeFromMass(big.kind, big.typeKey, big.m));

        if (selectedBody === small) selectedBody = big;
        events.push({ x: big.x, y: big.y, t: 0, type: 'impact' });
        toRemove.add(small);
      }
    }
  }
  if (toRemove.size === 0) return false;
  /* ★ 被合并掉的天体若正是跟随目标，必须一并解除跟随，否则相机会去追一个不存在的天体 */
  if (selectedBody && toRemove.has(selectedBody)) clearSelection();
  bodies = bodies.filter(b => !toRemove.has(b));
  for (const ev of events) impactEvents.push(ev);
  /* ★ 新增：合并结束后立刻检查天体演化（质量突破阈值 → 升级 / 坍缩成黑洞） */
  runEvolutionPass();
  return true;
}

function totalEnergy() {
  let K = 0, U = 0;
  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (bi.kind === 'satellite') continue;
    K += 0.5 * bi.m * (bi.vx * bi.vx + bi.vy * bi.vy);
    for (let j = i + 1; j < bodies.length; j++) {
      const bj = bodies[j];
      if (bj.kind === 'satellite') continue;
      const r = Math.hypot(bj.x - bi.x, bj.y - bi.y);
      U -= G * bi.m * bj.m / Math.max(r, SOFTENING);
    }
  }
  return K + U;
}

function sampleTrails() {
  const maxLen = MAX_TRAIL * 2;
  for (const b of bodies) {
    const t = b.trail;
    t.push(b.x, b.y);
    /* ★ 性能：以前每次采样都 splice(0,1)，等于每次 O(n) 搬整个数组，
       一秒钟 200 次采样 × 上百个天体 = 大量搬运与 GC 抖动。
       现在只在超出 TRAIL_TRIM 时才裁一次，摊还成本接近 0。 */
    if (t.length > maxLen + TRAIL_TRIM) t.splice(0, t.length - maxLen);
  }
}

/* ===================== 生命系统 ===================== */
function killLife(b, color) {
  b.flash = 1.0;
  b.flashColor = color || [255, 120, 90];
  b.life = 0;
  b.lifeStage = 'barren';
  b.gestationTimer = 0;
}

/* ===================== 碰撞处理 ===================== */
function collisionRadius(b) {
  /* ★ 新增：黑洞的"事件视界"按恒星量级给半径，靠引力把一切吞进来 */
  if (b.kind === 'blackhole') return 0.12 * b.rMul * b.sizeMul;
  if (b.kind === 'star')      return 0.10 * b.rMul * b.sizeMul;
  if (b.kind === 'planet')    return 0.06 * b.sizeMul;
  if (b.kind === 'asteroid')  return 0.03 * b.sizeMul;
  if (b.kind === 'satellite') return 0.03 * b.sizeMul;
  return 0.05;
}

function resolveCollisions() {
  const toRemove = new Set();
  const events = [];

  for (let i = 0; i < bodies.length; i++) {
    const bi = bodies[i];
    if (toRemove.has(bi)) continue;
    if (bi.kind === 'satellite') continue;

    for (let j = i + 1; j < bodies.length; j++) {
      /* ★ 修复：同上 —— bi 被合并掉后不能再参与后续合并，否则天体凭空消失 */
      if (toRemove.has(bi)) break;
      const bj = bodies[j];
      if (toRemove.has(bj)) continue;
      if (bj.kind === 'satellite') continue;

      const d = Math.hypot(bj.x - bi.x, bj.y - bi.y);

      const biAst = bi.kind === 'asteroid';
      const bjAst = bj.kind === 'asteroid';
      const biPla = bi.kind === 'planet';
      const bjPla = bj.kind === 'planet';

      let isCollision = false;
      let isAsteroidImpact = false;

      if ((biAst && bjPla) || (bjAst && biPla)) {
        const planet = biPla ? bi : bj;
        const r = IMPACT_BASE_R + IMPACT_R_PER_SIZE * planet.sizeMul;
        if (d < r) {
          isCollision = true;
          isAsteroidImpact = true;
        }
      } else {
        const rA = collisionRadius(bi);
        const rB = collisionRadius(bj);
        if (d < rA + rB) isCollision = true;
      }

      if (!isCollision) continue;

      let big, small;
      if (bi.m >= bj.m) { big = bi; small = bj; }
      else { big = bj; small = bi; }

      if (isAsteroidImpact) {
        const planet = biPla ? bi : bj;
        const asteroid = biAst ? bi : bj;

        let satCount = 0;
        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === planet && !toRemove.has(s)) satCount++;
        }

        let intercepted = false;
        if (satCount > 0) {
          const chance = Math.min(SAT_INTERCEPT_MAX, SAT_INTERCEPT_PER * satCount);
          if (Math.random() < chance) intercepted = true;
        }

        if (intercepted) {
          events.push({ x: planet.x, y: planet.y, t: 0, type: 'shield' });
          toRemove.add(asteroid);
        } else {
          if (planet.lifeStage === 'gestating') {
            planet.gestationTimer = 10 + Math.random() * 20;
            planet.flash = 0.9;
            planet.flashColor = [255, 180, 80];
          } else if (planet.lifeStage === 'alive' || planet.life > 0) {
            killLife(planet, [255, 130, 60]);
          } else {
            planet.flash = 0.6;
            planet.flashColor = [255, 160, 70];
          }
          events.push({ x: planet.x, y: planet.y, t: 0, type: 'impact' });

          const mergedMP = planet.m + asteroid.m;
          planet.vx = (planet.m * planet.vx + asteroid.m * asteroid.vx) / mergedMP;
          planet.vy = (planet.m * planet.vy + asteroid.m * asteroid.vy) / mergedMP;
          planet.x = (planet.m * planet.x + asteroid.m * asteroid.x) / mergedMP;
          planet.y = (planet.m * planet.y + asteroid.m * asteroid.y) / mergedMP;
          planet.m  = mergedMP;
          planet.sizeMul = Math.min(4.0, sizeFromMass(planet.kind, planet.typeKey, planet.m));

          if (selectedBody === asteroid) selectedBody = planet;
          toRemove.add(asteroid);
        }
      } else {
        for (const s of bodies) {
          if (s.kind === 'satellite' && s.host === small && !toRemove.has(s)) {
            s.host = big;
            const dx = s.x - big.x;
            const dy = s.y - big.y;
            s.orbitRadius = Math.max(0.15, Math.hypot(dx, dy));
            s.orbitPhase = Math.atan2(dy, dx);
            const vPhys = Math.sqrt(G * Math.max(big.m, 1e-9) / s.orbitRadius);
            s.orbitAngularSpeed = (vPhys / s.orbitRadius) * SATELLITE_SPEED_MUL;
          }
        }

        if (small.kind === 'planet' && (small.lifeStage === 'alive' || small.life > 0)) {
          killLife(small, [255, 100, 60]);
        }

        events.push({ x: big.x, y: big.y, t: 0, type: 'impact' });

        const mergedM = big.m + small.m;
        big.vx = (big.m * big.vx + small.m * small.vx) / mergedM;
        big.vy = (big.m * big.vy + small.m * small.vy) / mergedM;
        big.x  = (big.m * big.x  + small.m * small.x)  / mergedM;
        big.y  = (big.m * big.y  + small.m * small.y)  / mergedM;
        big.m  = mergedM;
        big.sizeMul = Math.min(4.0, sizeFromMass(big.kind, big.typeKey, big.m));

        if (selectedBody === small) selectedBody = big;
        toRemove.add(small);
      }
    }
  }

  if (toRemove.size > 0) {
    /* ★ 同上：跟随目标被吞掉时一起解除跟随 */
    if (selectedBody && toRemove.has(selectedBody)) clearSelection();
    bodies = bodies.filter(b => !toRemove.has(b));
    computeAccel();
  }

  for (const ev of events) impactEvents.push(ev);

  /* ★ 新增：撞击 / 合并把质量推过阈值时，立刻触发演化检查 */
  if (toRemove.size > 0) runEvolutionPass();
}

/* ===================== 生命演化 ===================== */
/* ★ 性能：这里原来每帧对每个行星都跑一遍 getHabitabilityInfo（内部又遍历所有天体），
   天体一多就是 O(行星 × 天体) / 帧。生命本身是慢变量（+0.06/秒、-0.05/秒），
   12Hz 更新与 60Hz 肉眼无差别。
   ★ 另外把"闪光 / 撞击环"这类必须逐帧线性衰减的效果拆成 ageImpactEffects。 */
function ageImpactEffects(dt) {
  if (dt <= 0) return;
  for (const ev of impactEvents) ev.t += dt;
  /* ★ 演化爆炸（life = 2.6s）比普通撞击（1.2s）活得久，按各自寿命回收 */
  if (impactEvents.length) impactEvents = impactEvents.filter(ev => ev.t < (ev.life || 1.2));
  for (const b of bodies) {
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 1.6);
  }
}

function updateLife(simDt) {
  if (simDt <= 0) return;
  /* ★ resolveCollisions 已移至主循环物理步内，此处不再调用 */

  for (const b of bodies) {
    if (b.kind !== 'planet') continue;

    /* ★ 新增：黑洞范围内的行星直接判定为 tooHot → 抹杀生命 */
    if (isScorchedByBlackHole(b)) {
      if (b.lifeStage === 'alive' || b.life > 0 || b.lifeStage === 'gestating') {
        killLife(b, [255, 90, 60]);
      }
      continue;
    }

    const info = getHabitabilityInfo(b);

    if (info.tooHot) {
      if (b.lifeStage === 'alive' || b.life > 0 || b.lifeStage === 'gestating') {
        killLife(b, [255, 90, 60]);
      }
      continue;
    }

    if (info.inHZ && b.water) {
      if (b.lifeStage === 'barren') {
        b.lifeStage = 'gestating';
        b.gestationTimer = 10 + Math.random() * 20;
      } else if (b.lifeStage === 'gestating') {
        b.gestationTimer -= simDt;
        if (b.gestationTimer <= 0) {
          b.lifeStage = 'alive';
          b.life = 0.08;
          b.flash = 0.6;
          b.flashColor = [140, 255, 180];
        }
      } else if (b.lifeStage === 'alive') {
        b.life = Math.min(1, b.life + 0.06 * simDt);
      }
    } else {
      if (b.lifeStage === 'gestating') {
        b.lifeStage = 'barren';
        b.gestationTimer = 0;
      } else if (b.lifeStage === 'alive') {
        const decay = info.tooCold ? 0.03 : 0.05;
        b.life = Math.max(0, b.life - decay * simDt);
        if (b.life <= 0.02) killLife(b, [120, 180, 255]);
      }
    }
  }
}

/* ===================== 放置天体 ===================== */
function placeBody(kind, typeKey, sizeMulVal, x, y, motion, host) {
  if (!isCategory(kind)) return null;
  if (!CATEGORIES[kind].types[typeKey]) typeKey = Object.keys(CATEGORIES[kind].types)[0];
  const b = createBody(kind, typeKey, sizeMulVal, x, y);

  if (kind === 'satellite') {
    if (!host || host.kind === 'satellite') return null;
    b.host = host;
    const dx = x - host.x, dy = y - host.y;
    let r = Math.hypot(dx, dy);
    const minR = 0.12 + 0.10 * host.sizeMul;
    const maxR = 1.6;
    if (r < minR) r = minR;
    if (r > maxR) r = maxR;
    b.orbitRadius = r;
    b.orbitPhase = Math.atan2(dy, dx);
    const vPhys = Math.sqrt(G * Math.max(host.m, 1e-9) / r);
    b.orbitAngularSpeed = (vPhys / r) * SATELLITE_SPEED_MUL;
    b.x = host.x + Math.cos(b.orbitPhase) * r;
    b.y = host.y + Math.sin(b.orbitPhase) * r;
    b.vx = host.vx - Math.sin(b.orbitPhase) * r * b.orbitAngularSpeed;
    b.vy = host.vy + Math.cos(b.orbitPhase) * r * b.orbitAngularSpeed;
  } else if (motion === 'orbit') {
    /* ★ 找主导天体（质量最大的非卫星天体），只与它构成两体圆轨道。 */
    let dominant = null;
    let maxMass = 0;
    for (const other of bodies) {
      if (other.kind === 'satellite') continue;
      if (other.m > maxMass) { maxMass = other.m; dominant = other; }
    }

    if (dominant) {
      const dx = x - dominant.x, dy = y - dominant.y;
      const r = Math.hypot(dx, dy);
      /* ★ 隐患修复：给 minR 加上上限，避免红巨星拉满时周围 1.5 半径内只能静止放置。 */
      const minR = Math.max(0.3, Math.min(1.0, collisionRadius(dominant) * 3));

      if (r > minR) {
        const totalM = dominant.m + b.m;
        /* ★ 限制最大圆轨道速度，防止极端情况速度爆炸。 */
        const vRel = Math.min(Math.sqrt(G * totalM / r), 8);
        const ux = -dy / r, uy = dx / r;

        /* ★ Bug 1 修复：把 dominant 的当前速度纳入计算。
           两体圆轨道的正确解（保持动量守恒 + 相对速度 = vRel·切向）：
           dominant.v' = (m_a·v_a - m_b·vRel·u) / totalM
           b.v         = m_a·(v_a + vRel·u) / totalM
           v_a = 0 时退化为原实现；v_a ≠ 0（双星/漂移系统）时修正。 */
        const vAx = dominant.vx, vAy = dominant.vy;
        dominant.vx = (dominant.m * vAx - b.m * vRel * ux) / totalM;
        dominant.vy = (dominant.m * vAy - b.m * vRel * uy) / totalM;
        b.vx = (dominant.m / totalM) * (vAx + vRel * ux);
        b.vy = (dominant.m / totalM) * (vAy + vRel * uy);
      }
      /* r <= minR：静止放置，让引力自然决定命运（被捕获、被弹飞、或落入主导天体）。 */
    }
  }

  /* ★ E0 只在"从空宇宙放下第一个天体"时建立。 */
  const wasEmpty = bodies.length === 0;
  bodies.push(b);
  computeAccel();
  sampleTrails();
  if (wasEmpty) {
    markE0Dirty();
    /* ★ 空宇宙放下第一个天体：重新开启自动取景，让画面按新系统定好比例
       （否则用户之前手动缩放过会一直冻结在空宇宙的取景上） */
    resetAutoFit();
  }
  return b;
}

/* ===================== 查找 / 删除 ===================== */
function findBodyAtScreen(px, py) {
  let best = null, bestD = 34;
  const ox = W * 0.5, oy = H * 0.5;
  for (const b of bodies) {
    const sx = ox + (b.x - camX) * camScale;
    const sy = oy - (b.y - camY) * camScale;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

function findHostForSatellite(px, py) {
  let best = null, bestD = 60;
  const ox = W * 0.5, oy = H * 0.5;
  for (const b of bodies) {
    if (b.kind !== 'star' && b.kind !== 'planet') continue;
    const sx = ox + (b.x - camX) * camScale;
    const sy = oy - (b.y - camY) * camScale;
    const d = Math.hypot(sx - px, sy - py);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}
function deleteBody(b) {
  if (selectedBody === b) clearSelection();
  for (let k = bodies.length - 1; k >= 0; k--) {
    const s = bodies[k];
    if (s !== b && s.kind === 'satellite' && s.host === b) {
      if (selectedBody === s) clearSelection();
      bodies.splice(k, 1);
    }
  }
  const i = bodies.indexOf(b);
  if (i >= 0) bodies.splice(i, 1);
  computeAccel();
  hoverBody = null;
}

/* ===================== 相机 =====================
   ★ 修复（「视角自己动」的根因）：
     旧实现里 computeBaseScale() 直接依赖 smoothMaxD，而 smoothMaxD 是
     「变大立刻赋值、变小每帧 ×0.998」的单向平滑量。于是：
       · 一颗被甩出去的小行星 / 双星轨道的远心点 → 画面被瞬间推远；
       · 之后每帧只能缩回 0.2%（≈5.8 秒才减半）→ 长时间慢慢往回缩；
       · 用户捏合出来的 userZoom 只是倍率，基准一变缩放就被自动取景改写。
     三种现象叠在一起，就是「放着不动，画面自己一会儿推远一会儿拉近」。
     现在取景半径走「滞回死区 + 对数空间平滑」，且用户手动缩放过就冻结取景。 */

/* ★ 纯函数：只读 fitRadius，不改任何状态 */
function computeBaseScale() {
  if (!bodies.length) return FIT_EMPTY_SCALE;     /* 空宇宙：固定基准 */
  const viewMin = Math.min(W, H);
  if (!(viewMin > 0)) return FIT_EMPTY_SCALE;
  return Math.max(viewMin * VIEW_FILL_FRAC / Math.max(fitRadius, 0.01), 0.5);
}

/* 系统此刻「真正需要的」取景半径：质心到最远非卫星天体的距离 */
function computeRawFit() {
  if (!bodies.length) return FIT_MIN_RADIUS;
  const c = getCentroid();
  let maxD = FIT_MIN_RADIUS;
  for (const b of bodies) {
    if (b.kind === 'satellite') continue;      /* 卫星贴着宿主，不额外撑开画面 */
    const d = Math.hypot(b.x - c.x, b.y - c.y);
    if (d > maxD) maxD = d;
  }
  return Number.isFinite(maxD) ? Math.min(maxD, 1e9) : FIT_MIN_RADIUS;
}

/* ★ 有副作用：更新 fitTarget / fitRadius，只在 updateCamera 里调用 */
function updateFitRadius(dt) {
  if (!bodies.length) {
    fitTarget = FIT_MIN_RADIUS;
    fitRadius = FIT_MIN_RADIUS;
    return;
  }
  /* ★ 用户手动缩放过 → 冻结取景：画面不会再自己缩放（按 R 恢复） */
  if (!autoFit) return;

  const raw = computeRawFit();
  /* ★ 滞回死区：只有明显超出 / 明显小于当前目标才更新目标。
     轨道的周期性尺度变化只要落在 ±25% 以内，画面就完全不动。 */
  if (raw > fitTarget * FIT_GROW_BAND) fitTarget = raw;
  else if (raw < fitTarget * FIT_SHRINK_BAND) fitTarget = raw;

  /* ★ 对数空间插值：视觉上匀速（线性插值会让「拉近」越到后面越慢） */
  if (dt > 0 && fitTarget > 0 && fitRadius > 0 && fitTarget !== fitRadius) {
    const tau = (fitTarget > fitRadius) ? FIT_TAU_OUT : FIT_TAU_IN;
    const a = 1 - Math.exp(-Math.min(dt, 0.1) / tau);
    fitRadius *= Math.pow(fitTarget / fitRadius, a);
  }
  if (!Number.isFinite(fitRadius) || fitRadius < 1e-6) fitRadius = FIT_MIN_RADIUS;
  if (!Number.isFinite(fitTarget) || fitTarget < 1e-6) fitTarget = FIT_MIN_RADIUS;
}

/* 重新开启自动取景（读档 / 新建 / 清空 / 按 R） */
function resetAutoFit() {
  autoFit = true;
  fitTarget = computeRawFit();
  fitRadius = fitTarget;
}

/* 用户手动缩放 → 交出取景控制权，此后画面不再自己缩放 */
function takeOverZoom() {
  if (!autoFit) return;
  autoFit = false;
  fitTarget = fitRadius;   /* 冻结在用户看到的这一刻，避免切换瞬间跳一下 */
}

function clampUserZoom(z) {
  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
}

/* ★ 修复：最终缩放（基准 × userZoom）的全局兜底，保证渲染/交互用到的 camScale 有界 */
function clampCamScale(s) {
  if (!Number.isFinite(s)) return FIT_EMPTY_SCALE;
  return Math.max(0.02, Math.min(MAX_CAM_SCALE, s));
}

function updateCamera(dt) {
  if (isGesturing) return;          /* 手势中由 pointer 事件直接写相机 */

  updateFitRadius(dt);

  const anchor = getCameraAnchor();
  const following = followCam && selectedBody && bodies.indexOf(selectedBody) >= 0;
  /* 跟随时用更硬的跟随系数避免滞后；否则用宽宽松松的一阶跟随 */
  const k = following
    ? Math.min(1, dt * 16)
    : (1 - Math.pow(0.0015, Math.min(dt, 0.05)));

  camTarget.x = anchor.x + userPanX;
  camTarget.y = anchor.y + userPanY;
  camTarget.s = clampCamScale(computeBaseScale() * userZoom);

  camX += (camTarget.x - camX) * k;
  camY += (camTarget.y - camY) * k;
  camScale = clampCamScale(camScale + (camTarget.s - camScale) * k);
}

function resetView() {
  userZoom = 1;
  userPanX = 0;
  userPanY = 0;
  resetAutoFit();                   /* ★ 同时恢复自动取景 */
}

/* ===================== 界面状态同步 =====================
   ★ 修复：paused / speed / sizeMul / 初速 / 宜居带 以前散落在多处手写赋值，
   导致"新建宇宙/退出/加载存档"后按钮文字与实际状态不一致（例如暂停后
   新建宇宙，宇宙一开始就是冻结的，按钮却仍显示"暂停"）。
   现在所有入口统一走下面这几个 setter。 */
function setPaused(v) {
  paused = !!v;
  const btn = document.getElementById('btnPause');
  if (btn) btn.textContent = paused ? '继续' : '暂停';
  lastT = performance.now();
}

function togglePause() { setPaused(!paused); }

/* ===================== 速度倍率（对数滑杆，最高 32×） =====================
   ★ 需求：上限 32×。如果直接用 0.1–32 的线性滑杆，1× 附近几乎无法精确选择
   （屏幕宽度上一像素 ≈ 0.2×），低倍率的手感会彻底失去。
   所以滑杆用 0–1000 的"对数位置"，映射到 0.1–32 的真实倍率：
   低位精细、高位粗放，与原来 0.1–4 线性滑杆的低区手感基本一致。 */
const SPEED_MIN = 0.1;
const SPEED_MAX = 32;
const SPEED_SLIDER_STEPS = 1000;

function speedToSlider(s) {
  const v = clampNum(s, SPEED_MIN, SPEED_MAX);
  return Math.round(Math.log(v / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN) * SPEED_SLIDER_STEPS);
}

function sliderToSpeed(pos) {
  const t = clampNum(pos, 0, SPEED_SLIDER_STEPS) / SPEED_SLIDER_STEPS;
  return SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, t);
}

/* 速度显示文案：低倍率保留一位小数，10× 以上只显示整数，避免"32.0×"这种冗余 */
function speedLabel() {
  return (speed < 10 ? speed.toFixed(1) : String(Math.round(speed))) + '×';
}

function setSpeed(v) {
  speed = clampNum(v, SPEED_MIN, SPEED_MAX);
  const slider = document.getElementById('speed');
  if (slider) slider.value = String(speedToSlider(speed));
  const lbl = document.getElementById('speedVal');
  if (lbl) lbl.textContent = speedLabel();
}

function setSizeMul(v) {
  sizeMul = clampNum(v, 0.5, 2.5);
  const slider = document.getElementById('size');
  if (slider) slider.value = String(sizeMul);
  const lbl = document.getElementById('sizeVal');
  if (lbl) lbl.textContent = sizeMul.toFixed(1) + '×';
}

function setMotion(v) {
  placeMotion = (v === 'static') ? 'static' : 'orbit';
  const on = document.getElementById('motOrbit');
  const off = document.getElementById('motStatic');
  if (on) on.classList.toggle('active', placeMotion === 'orbit');
  if (off) off.classList.toggle('active', placeMotion === 'static');
}

function setHabitableZone(v) {
  showHabitableZone = !!v;
  const btn = document.getElementById('btnHabitable');
  if (btn) btn.classList.toggle('active', showHabitableZone);
}

/* ===================== 键盘辅助 ===================== */
function panByKey(dx, dy) {
  const step = 90 / camScale;
  userPanX += dx * step;
  userPanY += dy * step;
}

function zoomBy(factor) {
  takeOverZoom();                            /* ★ 键盘缩放也接管取景 */
  userZoom = clampUserZoom(userZoom * factor);
}

/* ===================== 渲染尺寸 ===================== */
function coreRadius(b) {
  /* ★ 新增：黑洞的核心（事件视界）比恒星更紧凑，靠吸积盘撑起视觉体积 */
  if (b.kind === 'blackhole') return 4.2 * b.rMul * b.sizeMul;
  if (b.kind === 'star')      return 5.5 * b.rMul * b.sizeMul;
  if (b.kind === 'planet')    return 1.6 + 1.8 * b.sizeMul;
  if (b.kind === 'asteroid')  return 0.7 + 0.9 * b.sizeMul;
  return 1.0 + 1.0 * b.sizeMul;
}

/* ===================== 渲染 ===================== */
/* ★ 性能：星体光晕原来是「每个天体每帧一次 createRadialGradient + fill」，
   颜色其实只有类型表里那十几种。改成按颜色预渲染离屏精灵，
   之后每帧只做 drawImage（Canvas 的 drawImage 有硬件加速路径，比渐变填充便宜得多）。 */
const __glowSprites = new Map();
const GLOW_SPRITE_MAX = 64;
/* ★ 修复：颜色量化（每通道 /8 取整）+ 数量上限。
   原来 key 直接用原始 rgb，导入的存档里上千种颜色会各自生成一张
   192×192 离屏画布（约 147KB/张），低端机直接 OOM。 */
function glowKey(r, g, bl, kind) {
  const q = function (v) {
    const n = Math.round(numOr(v, 0) / 8) * 8;
    return Math.max(0, Math.min(255, n));
  };
  return kind + '|' + q(r) + ',' + q(g) + ',' + q(bl);
}
function glowSprite(r, g, bl, kind) {
  const key = glowKey(r, g, bl, kind);
  let cv = __glowSprites.get(key);
  if (cv) {
    /* 命中后移到队尾，让 Map 的插入顺序近似 LRU */
    __glowSprites.delete(key);
    __glowSprites.set(key, cv);
    return cv;
  }
  if (__glowSprites.size >= GLOW_SPRITE_MAX) {
    const oldest = __glowSprites.keys().next().value;
    if (oldest !== undefined) __glowSprites.delete(oldest);
  }
  const S = 96;
  cv = document.createElement('canvas');
  cv.width = cv.height = S * 2;
  const c2 = cv.getContext('2d');
  const grd = c2.createRadialGradient(S, S, 0, S, S, S);
  if (kind === 'core-star') {
    grd.addColorStop(0.00, 'rgba(255,255,255,0.98)');
    grd.addColorStop(0.10, `rgba(${r},${g},${bl},0.95)`);
    grd.addColorStop(0.32, `rgba(${r},${g},${bl},0.30)`);
    grd.addColorStop(0.65, `rgba(${r},${g},${bl},0.08)`);
    grd.addColorStop(1.00, `rgba(${r},${g},${bl},0)`);
  } else if (kind === 'core-body') {
    grd.addColorStop(0.00, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.16, `rgba(${r},${g},${bl},0.92)`);
    grd.addColorStop(0.42, `rgba(${r},${g},${bl},0.26)`);
    grd.addColorStop(1.00, `rgba(${r},${g},${bl},0)`);
  } else if (kind === 'flash') {
    grd.addColorStop(0.00, `rgba(${r},${g},${bl},0.75)`);
    grd.addColorStop(0.45, `rgba(${r},${g},${bl},0.28)`);
    grd.addColorStop(1.00, `rgba(${r},${g},${bl},0)`);
  } else { /* life */
    grd.addColorStop(0.00, 'rgba(140,255,180,1)');
    grd.addColorStop(0.22, 'rgba( 90,235,140,0.55)');
    grd.addColorStop(0.55, 'rgba( 60,200,110,0.18)');
    grd.addColorStop(1.00, 'rgba( 40,170, 90,0)');
  }
  c2.fillStyle = grd;
  c2.beginPath(); c2.arc(S, S, S, 0, TWO_PI); c2.fill();
  __glowSprites.set(key, cv);
  return cv;
}
function drawGlow(r, g, bl, kind, x, y, radius, alpha) {
  if (!(radius > 0.5)) return;
  const sprite = glowSprite(r, g, bl, kind);
  if (alpha !== undefined && alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(sprite, x - radius, y - radius, radius * 2, radius * 2);
  if (alpha !== undefined && alpha !== 1) ctx.globalAlpha = 1;
}

/* 选中光环：普通天体与黑洞共用（从原 render 内联代码抽出来） */
function drawSelectionRing(x, y, core) {
  const t = performance.now() * 0.003;
  const rr = core * 3.2 + 8 + Math.sin(t) * 3;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = 'rgba(100, 220, 255, 0.95)';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.arc(x, y, rr, 0, TWO_PI); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = 'rgba(150, 235, 255, 0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, rr + 5, 0, TWO_PI); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
}

/* ★ 新增：黑洞专用渲染 —— 中心纯黑（事件视界）+ 外围炽热吸积盘（红黄渐变）。
   ★ 性能：只对黑洞走这条路径，普通天体仍用预渲染光晕精灵。 */
function drawBlackHole(x, y, core) {
  const eventR = Math.max(2.4, core * 1.5);   /* 事件视界半径（纯黑圆） */
  const diskR  = eventR * 6.5;                /* 吸积盘外缘 */
  /* 缓慢的明暗呼吸，让静止的环也有"活着"的感觉 */
  const pulse  = 0.90 + 0.10 * Math.sin(performance.now() * 0.0016);

  /* 1) 吸积盘外辉光：由内到外 白热 → 金 → 橙红 → 暗红 → 透明 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  const grd = ctx.createRadialGradient(x, y, eventR * 0.9, x, y, diskR);
  grd.addColorStop(0.00, 'rgba(255, 250, 218, 0.95)');
  grd.addColorStop(0.12, 'rgba(255, 214, 120, 0.80)');
  grd.addColorStop(0.30, 'rgba(255, 140, 45, 0.55)');
  grd.addColorStop(0.58, 'rgba(200, 55, 20, 0.26)');
  grd.addColorStop(1.00, 'rgba(90, 10, 0, 0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(x, y, diskR, 0, TWO_PI); ctx.fill();

  /* 2) 吸积盘：一整根连续的炽热环（不分段、不切断）
     ★ 关键：环半径 × 0.42 必须明显大于事件视界半径，否则环的上下两端会被
       后面画的纯黑圆盖掉，看上去又变回"两段弧"。这里取 3.0 倍留足余量。 */
  const ringR = eventR * 3.0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, 0.42);              /* 压扁 → 倾斜的盘面 */

  /* 2.1 环外侧的柔和热辉：同一条路径 + 更粗更淡，让环像"烧红的一整根" */
  ctx.strokeStyle = `rgba(255, 145, 55, ${0.26 * pulse})`;
  ctx.lineWidth = Math.max(3, eventR * 1.30);
  ctx.beginPath(); ctx.arc(0, 0, ringR, 0, TWO_PI); ctx.stroke();

  /* 2.2 主环：一整根，用线性渐变让左右亮度不同（多普勒增亮的感觉） */
  const lg = ctx.createLinearGradient(-ringR, 0, ringR, 0);
  lg.addColorStop(0.00, 'rgba(255, 100, 25, 0.55)');
  lg.addColorStop(0.24, 'rgba(255, 212, 132, 0.95)');
  lg.addColorStop(0.48, 'rgba(255, 252, 232, 1.00)');
  lg.addColorStop(0.70, 'rgba(255, 182, 82, 0.88)');
  lg.addColorStop(1.00, 'rgba(255, 96, 22, 0.50)');
  ctx.strokeStyle = lg;
  ctx.lineWidth = Math.max(2, eventR * 0.52);
  ctx.beginPath(); ctx.arc(0, 0, ringR, 0, TWO_PI); ctx.stroke();

  /* 2.3 环内侧的一道细亮边：给这一根环一点厚度感 */
  ctx.strokeStyle = 'rgba(255, 244, 208, 0.72)';
  ctx.lineWidth = Math.max(1, eventR * 0.14);
  ctx.beginPath(); ctx.arc(0, 0, ringR - eventR * 0.32, 0, TWO_PI); ctx.stroke();
  ctx.restore();

  /* 3) 纯黑核心：用 source-over 覆盖，保证中心是真的"一点光都没有" */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(x, y, eventR, 0, TWO_PI); ctx.fill();

  /* 4) 光子环：视界边缘一圈极亮的细描边 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255, 226, 160, 0.85)';
  ctx.lineWidth = Math.max(1, eventR * 0.16);
  ctx.beginPath(); ctx.arc(x, y, eventR * 1.05, 0, TWO_PI); ctx.stroke();
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W, H);

  /* ★ 性能：星空按亮度分桶，每桶一次 fill。
     原来 300+ 颗星就是 300+ 次 fillRect + globalAlpha 赋值，纯属浪费。 */
  ctx.fillStyle = '#9db2cc';
  for (let k = 0; k < starBuckets.length; k++) {
    const bucket = starBuckets[k];
    if (!bucket.length) continue;
    ctx.globalAlpha = (k + 0.5) / STAR_BUCKETS * 0.67;
    ctx.beginPath();
    for (const s of bucket) ctx.rect(s.x, s.y, s.r, s.r);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const ox = W * 0.5, oy = H * 0.5;
  const SX = x => ox + (x - camX) * camScale;
  const SY = y => oy - (y - camY) * camScale;

  if (mode === 'delete' && mouseX >= 0) {
    hoverBody = findBodyAtScreen(mouseX, mouseY);
  } else {
    hoverBody = null;
  }

  if (mode === 'satellite') {
    const pulse = 0.55 + 0.35 * Math.sin(simTime * 3.0 + performance.now() * 0.002);
    for (const b of bodies) {
      /* ★ 黑洞也可以作为卫星宿主（卫星会被它圈住，直到被吞噬） */
      if (b.kind !== 'star' && b.kind !== 'planet' && b.kind !== 'blackhole') continue;
      const x = SX(b.x), y = SY(b.y);
      const baseR = coreRadius(b) * 3.5 + 8;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = pulse;
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255, 215, 110, 0.95)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y, baseR, 0, TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  if (showHabitableZone) {
    for (const b of bodies) {
      if (b.kind !== 'star') continue;
      const x = SX(b.x), y = SY(b.y);
      const hz = habitableZone(b);
      const rInPx  = hz.rIn  * camScale;
      const rOutPx = hz.rOut * camScale;
      if (rOutPx < 4) continue;

      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(x, y, rOutPx, 0, TWO_PI);
      if (rInPx > 0.5) ctx.arc(x, y, rInPx, 0, TWO_PI, true);
      ctx.fillStyle = 'rgba(70, 235, 130, 0.075)';
      ctx.fill('evenodd');

      ctx.strokeStyle = 'rgba(90, 245, 150, 0.32)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, rInPx, 0, TWO_PI); ctx.stroke();
      ctx.strokeStyle = 'rgba(90, 245, 150, 0.22)';
      ctx.beginPath(); ctx.arc(x, y, rOutPx, 0, TWO_PI); ctx.stroke();

      if (rOutPx > 10) {
        const grd = ctx.createRadialGradient(x, y, rInPx, x, y, rOutPx);
        grd.addColorStop(0.00, 'rgba(80,240,140,0)');
        grd.addColorStop(0.50, 'rgba(80,240,140,0.10)');
        grd.addColorStop(1.00, 'rgba(80,240,140,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(x, y, rOutPx, 0, TWO_PI); ctx.fill();
      }
      if (rOutPx > 55) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#6ee7a0';
        ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('宜居带', x, y - rOutPx - 6);
        ctx.globalAlpha = 1;
      }
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const b of bodies) {
    const t = b.trail;
    const n = t.length / 2;
    if (n < 2) continue;
    const [r, g, bl] = b.rgb;
    const isStar = b.kind === 'star';
    const isSat  = b.kind === 'satellite';
    ctx.strokeStyle = `rgb(${r},${g},${bl})`;
    ctx.lineWidth = isStar ? 1.5 : (isSat ? 0.9 : 1.1);

    /* ★ 性能：轨迹满时是 1200 点，每帧要发几十次 stroke；点太多就按步长抽稀
       （屏幕上看不出差别），并把每段的点数收敛到 CHUNK 附近 */
    const stride = n > 480 ? Math.ceil(n / 480) : 1;
    /* ★ 新增：黑洞的轨迹线透明度压到 0.05（几乎不可见，只留一点引力走向） */
    const baseA = (b.kind === 'blackhole') ? 0.05 : (isStar ? 0.50 : (isSat ? 0.35 : 0.42));
    const invN = n - 1;
    for (let s = 0; s < n - 1; s += CHUNK * stride) {
      const e = Math.min(s + CHUNK * stride, n - 1);
      const a = baseA * Math.pow(s / invN, 1.7);
      if (a < 0.008) continue;
      /* ★ 修复：分块屏幕剔除 —— 整块轨迹都在视口同侧之外就跳过，
         极端缩放下不再生成上百万像素的路径 */
      const sxA = SX(t[s * 2]), syA = SY(t[s * 2 + 1]);
      const sxB = SX(t[e * 2]), syB = SY(t[e * 2 + 1]);
      if ((sxA < -TRAIL_CULL && sxB < -TRAIL_CULL) ||
          (sxA > W + TRAIL_CULL && sxB > W + TRAIL_CULL) ||
          (syA < -TRAIL_CULL && syB < -TRAIL_CULL) ||
          (syA > H + TRAIL_CULL && syB > H + TRAIL_CULL)) continue;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(sxA, syA);
      for (let k = s + stride; k <= e; k += stride) {
        ctx.lineTo(SX(t[k * 2]), SY(t[k * 2 + 1]));
      }
      if ((e - s) % stride !== 0) ctx.lineTo(sxB, syB);
      ctx.stroke();
    }
  }

  for (const b of bodies) {
    const x = SX(b.x), y = SY(b.y);
    if (x < -320 || x > W + 320 || y < -320 || y > H + 320) continue;

    const [r, g, bl] = b.rgb;
    const core = coreRadius(b);
    const isStar = b.kind === 'star';
    const R = core * (isStar ? 6.5 : 5);

    /* ★ 新增：黑洞走专用渲染（纯黑视界 + 炽热吸积盘），不参与普通光晕 / 生命特效 */
    if (b.kind === 'blackhole') {
      drawBlackHole(x, y, core);
      if (b === selectedBody) drawSelectionRing(x, y, core);
      ctx.globalCompositeOperation = 'lighter';
      continue;
    }

    if (b.kind === 'planet' && b.lifeStage === 'gestating') {
      const prog = 1 - Math.max(0, b.gestationTimer) / 30;
      const pulse = 0.55 + 0.45 * Math.sin(simTime * 3.0);
      const gr = core * (2.0 + prog * 1.5) * 4;
      const grd = ctx.createRadialGradient(x, y, 0, x, y, gr);
      grd.addColorStop(0.00, `rgba(120,235,190,${0.10 + 0.10 * pulse * prog})`);
      grd.addColorStop(0.55, `rgba( 90,220,160,${0.04 * prog})`);
      grd.addColorStop(1.00, 'rgba( 60,200,130,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, TWO_PI); ctx.fill();
    }

    if (b.kind === 'planet' && b.life > 0.02) {
      const lifeR = core * (2.2 + b.life * 3.4) * 4;
      const pulse = 1 + 0.06 * Math.sin(simTime * 2.4);
      ctx.globalAlpha = 1;
      drawGlow(0, 0, 0, 'life', x, y, lifeR * pulse, Math.min(1, b.life * 0.55));
    }

    if (b.kind === 'planet' && b.flash > 0 && b.flashColor) {
      const [fr, fg, fb] = b.flashColor;
      const flashR = core * (3.0 + (1 - b.flash) * 6.0) * 4;
      ctx.globalAlpha = 1;
      drawGlow(fr, fg, fb, 'flash', x, y, flashR, b.flash);
    }

    /* ★ 性能：核心光晕改走预渲染精灵，省掉每帧一次 createRadialGradient */
    ctx.globalAlpha = 1;
    drawGlow(r, g, bl, isStar ? 'core-star' : 'core-body', x, y, R);

    if (b.water && !isStar) {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = 'rgba(130,205,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, core * 1.6, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (b.kind === 'planet' && b.life > 0.35) {
      const lifeAlpha = Math.min(0.85, (b.life - 0.35) * 1.5);
      ctx.globalAlpha = lifeAlpha;
      ctx.strokeStyle = 'rgba(120,255,170,0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, core * 2.4, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (b.kind === 'planet' && b.lifeStage === 'gestating') {
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = 'rgba(140,235,180,0.7)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.arc(x, y, core * 2.0, 0, TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if (b === selectedBody) drawSelectionRing(x, y, core);
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const ev of impactEvents) {
    const x = SX(ev.x), y = SY(ev.y);
    /* ★ 演化爆炸用自己的寿命（2.6s）与尺寸倍率；普通撞击仍是 1.2s / 1× */
    const evLife = ev.life || 1.2;
    const prog = Math.max(0, Math.min(1, ev.t / evLife));
    const alpha = Math.max(0, 1 - prog);
    const evScale = ev.scale || 1;
    const ringR = (20 + prog * 90) * evScale;

    if (ev.type === 'evolution') {
      /* ★ 新增：天体演化爆炸 —— 白热冲击波 + 双层环 + 巨大核心闪光，又大又亮又久 */
      const r1 = (30 + prog * 260) * evScale;
      ctx.globalAlpha = alpha * 0.95;
      ctx.strokeStyle = 'rgba(255, 252, 235, 0.95)';
      ctx.lineWidth = Math.max(1, 7 * (1 - prog * 0.8));
      ctx.beginPath(); ctx.arc(x, y, r1, 0, TWO_PI); ctx.stroke();

      ctx.globalAlpha = alpha * 0.75;
      ctx.strokeStyle = 'rgba(255, 185, 95, 0.90)';
      ctx.lineWidth = Math.max(1, 3.5 * (1 - prog * 0.6));
      ctx.beginPath(); ctx.arc(x, y, r1 * 0.72, 0, TWO_PI); ctx.stroke();

      const evGrd = ctx.createRadialGradient(x, y, 0, x, y, r1 * 0.78);
      evGrd.addColorStop(0.00, `rgba(255, 255, 245, ${alpha * 0.95})`);
      evGrd.addColorStop(0.32, `rgba(255, 214, 140, ${alpha * 0.55})`);
      evGrd.addColorStop(0.66, `rgba(255, 120, 50, ${alpha * 0.24})`);
      evGrd.addColorStop(1.00, 'rgba(150, 30, 10, 0)');
      ctx.fillStyle = evGrd;
      ctx.beginPath(); ctx.arc(x, y, r1 * 0.78, 0, TWO_PI); ctx.fill();
    } else if (ev.type === 'shield') {
      ctx.globalAlpha = alpha * 0.95;
      ctx.strokeStyle = 'rgba(120, 220, 255, 0.95)';
      ctx.lineWidth = 3 * (1 - prog * 0.6);
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.85, 0, TWO_PI); ctx.stroke();
      ctx.globalAlpha = alpha * 0.7;
      ctx.strokeStyle = 'rgba(200, 240, 255, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.5, 0, TWO_PI); ctx.stroke();
      const coreGrd = ctx.createRadialGradient(x, y, 0, x, y, ringR * 0.6);
      coreGrd.addColorStop(0.00, `rgba(200, 240, 255, ${alpha * 0.7})`);
      coreGrd.addColorStop(0.55, `rgba(120, 200, 255, ${alpha * 0.35})`);
      coreGrd.addColorStop(1.00, 'rgba( 60, 140, 220, 0)');
      ctx.fillStyle = coreGrd;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.6, 0, TWO_PI); ctx.fill();
    } else {
      ctx.globalAlpha = alpha * 0.85;
      ctx.strokeStyle = 'rgba(255, 150, 60, 0.95)';
      ctx.lineWidth = 3 * (1 - prog * 0.6);
      ctx.beginPath(); ctx.arc(x, y, ringR, 0, TWO_PI); ctx.stroke();
      const coreGrd = ctx.createRadialGradient(x, y, 0, x, y, ringR * 0.7);
      coreGrd.addColorStop(0.00, `rgba(255, 240, 200, ${alpha})`);
      coreGrd.addColorStop(0.45, `rgba(255, 170, 80, ${alpha * 0.6})`);
      coreGrd.addColorStop(1.00, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = coreGrd;
      ctx.beginPath(); ctx.arc(x, y, ringR * 0.7, 0, TWO_PI); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  if (mode !== 'delete' && mode !== 'satellite' && mode !== 'follow' &&
      mouseX >= 0 && !isGesturing && inGame) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(120,170,240,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 14, 0, TWO_PI); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (mode === 'delete' && hoverBody) {
    const x = SX(hoverBody.x), y = SY(hoverBody.y);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,90,90,0.95)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(x, y, 22, 0, TWO_PI); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,120,120,0.9)';
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
    ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
/* ===================== HUD ===================== */
const hud = document.getElementById('hud');
let __hudAccum = 0;
let __lastEnergyText = '—';
let __lastEnergyCalc = -1;

function updateHUD() {
  if (!inGame) { hud.innerHTML = ''; return; }

  let ns = 0, np = 0, na = 0, nm = 0, nbh = 0;
  let aliveCount = 0, gestatingCount = 0, habitableCount = 0;

  for (const b of bodies) {
    if (b.kind === 'star') ns++;
    else if (b.kind === 'blackhole') nbh++;
    else if (b.kind === 'planet') {
      np++;
      if (b.lifeStage === 'alive') aliveCount++;
      else if (b.lifeStage === 'gestating') gestatingCount++;
      if (isInHabitableZoneSimple(b)) habitableCount++;
    }
    else if (b.kind === 'asteroid') na++;
    else nm++;
  }

  let energyStr = __lastEnergyText;
  if (!bodies.length) {
    energyStr = '—';
  } else if (__e0Pending || !__e0Initialized) {
    energyStr = '建立中…';
  } else if (simTime - __lastEnergyCalc > 0.5 || __lastEnergyCalc < 0) {
    const E = totalEnergy();
    const abs = Math.abs(E - E0);
    const absE0 = Math.abs(E0);
    if (absE0 > 1e-3) {
      const rel = abs / absE0 * 100;
      energyStr = `${abs.toFixed(3)} (${rel.toFixed(1)}%)`;
    } else {
      energyStr = abs.toFixed(3);
    }
    __lastEnergyText = energyStr;
    __lastEnergyCalc = simTime;
  }

  let lifeStr = '';
  if (np > 0) {
    lifeStr = ` <span class="k">|</span> <span class="life">生命 ${aliveCount}`;
    if (gestatingCount > 0) lifeStr += ` <span class="warn">(孕育 ${gestatingCount})</span>`;
    lifeStr += `</span>`;
    if (habitableCount > 0) lifeStr += ` <span class="k">(宜居 ${habitableCount})</span>`;
  }

  let followStr = '';
  if (selectedBody && bodies.indexOf(selectedBody) >= 0) {
    /* ★ 修复：名称来自存档（可被导入的 JSON 控制），必须转义后再拼进 innerHTML */
    /* ★ 区分「跟随中」与「只是选中」：以前只要有选中就写“跟随”，误导用户以为相机被锁了 */
    const selLabel = followCam ? '跟随' : '选中';
    followStr = ` <span class="k">|</span> <span class="follow">${selLabel}：${escHtml(selectedBody.name)}</span>`;
  }

  let saveStr = '';
  const curSave = saves.find(s => s.id === currentSaveId);
  if (curSave) saveStr = ` <span class="k">|</span> <span class="save">📁 ${escHtml(curSave.name)}</span>`;

  hud.innerHTML =
    `<span class="t">宇宙模拟器</span> · ` +
    `恒星 ${ns} · 行星 ${np} · 小行星 ${na} · 卫星 ${nm}` +
    (nbh > 0 ? ` · <span class="warn">黑洞 ${nbh}</span>` : '') + `<br>` +
    `<span class="k">t =</span> ${simTime.toFixed(2)} ` +
    `<span class="k">| 速度</span> ${speedLabel()} ` +
    `<span class="k">| 缩放</span> ${userZoom.toFixed(2)}× ` +
    `<span class="k">| ΔE</span> ${energyStr}` +
    lifeStr + followStr + saveStr +
    (paused ? ' <span class="k">| 已暂停</span>' : '') +
    (mode === 'delete' ? ' <span class="k">| 删除模式</span>' : '') +
    (mode === 'satellite' ? ' <span class="k">| 点天体加卫星</span>' : '') +
    (mode === 'follow' ? ' <span class="k">| 点天体跟随</span>' : '') +
    (showHabitableZone ? ' <span class="k">| 宜居带 ON</span>' : '');
}
